<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Français avec Marcel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9F0FB; --paper:#FFFFFF; --ink:#18275A; --soft:#5B6A94;
  --bleu:#2346A8; --rouge:#E2453C; --line:#CDD8EE;
  --water1:#7FD3E6; --water2:#2E8FB8; --sand:#F1D9A0;
  --ok:#14885A; --okbg:#DDF5E9; --bad:#C8322A; --badbg:#FDE3E1;
  --warn:#C77700; --warnbg:#FFF1DA; --violet:#6A38C2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1838; --paper:#18244D; --ink:#EEF2FF; --soft:#A9B6DD;
    --bleu:#8EA8FF; --rouge:#FF6E66; --line:#2C3B6E;
    --water1:#2B7F9C; --water2:#123E63; --sand:#8C7746;
    --ok:#4FD39A; --okbg:#173D33; --bad:#FF8A82; --badbg:#4A1E2A;
    --warn:#F0A63A; --warnbg:#4A3A1E; --violet:#8B67E6;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1838; --paper:#18244D; --ink:#EEF2FF; --soft:#A9B6DD;
  --bleu:#8EA8FF; --rouge:#FF6E66; --line:#2C3B6E;
  --water1:#2B7F9C; --water2:#123E63; --sand:#8C7746;
  --ok:#4FD39A; --okbg:#173D33; --bad:#FF8A82; --badbg:#4A1E2A;
  --warn:#F0A63A; --warnbg:#4A3A1E; --violet:#8B67E6;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 60px;display:grid;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(.88rem,3.9vw,1.15rem);font-weight:700;letter-spacing:-.01em;min-width:0;white-space:nowrap}
h1 .flag{display:inline-block;width:.55em;height:1.1em;vertical-align:-.15em;margin-right:.35em;border-radius:4px;
  background:linear-gradient(90deg,#2346A8 0 33%,#fff 33% 66%,#E2453C 66%);box-shadow:0 0 0 2px var(--line)}
.pill{font-size:.88rem;font-weight:600;background:var(--paper);border:1px solid var(--line);padding:4px 12px;border-radius:999px;white-space:nowrap;flex:none}

.marcel{display:flex;gap:12px;align-items:flex-end}
.cat{font-size:62px;line-height:1;flex:none;transform-origin:bottom center}
.cat.happy{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bubble{background:var(--paper);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:12px 16px;flex:1}
.bubble .fr{font-weight:600;font-size:1.15rem}
.bubble .ru{color:var(--soft)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px}
.level-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.level-num{font-size:1.3rem;font-weight:700}
.construction{color:var(--soft)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:0}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bleu),var(--rouge));transition:width .4s}
.prog{font-weight:600;font-size:.9rem;color:var(--soft);white-space:nowrap}

.stages{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:18px;overflow-x:auto;padding:6px 2px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.stage{flex:none;font:inherit;font-size:.95rem;font-weight:600;border:none;border-bottom:3px solid transparent;background:none;color:var(--soft);padding:8px 0 9px;cursor:pointer;margin-bottom:-1px}
.stage[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--violet)}
.stage:disabled{opacity:.45;cursor:not-allowed}
.stage .ck{color:var(--ok)}

.list{display:grid;gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px}
.item.done{border-color:var(--ok);background:var(--okbg)}
.item.wrong{border-color:var(--bad)}
.item-top{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-content:center;font-weight:600;font-size:.9rem;background:var(--bg);border:2px solid var(--line)}
.item.done .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.texts{flex:1;min-width:0}
.fr{font-size:1.25rem;font-weight:600;color:var(--bleu)}
.ru{color:var(--soft)}
.ru.big{font-size:1.2rem;color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:1rem;border:none;border-radius:14px;padding:10px 14px;cursor:pointer;color:#fff;background:var(--bleu);min-height:46px}
.btn.red{background:var(--rouge)}
.btn.violet{background:var(--violet)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;color:var(--bleu);padding:8px 6px;min-height:40px;border:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--rouge) 30%,transparent)}}
.btn:focus-visible,.stage:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 11px;flex:1;min-width:0}
.marks{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.theory{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:2px 14px 8px;margin-bottom:12px}
.theory summary{cursor:pointer;padding:10px 0;line-height:1.3;display:flex;align-items:center;gap:12px;list-style:none}
.theory summary::-webkit-details-marker{display:none}
.theory .th-main{flex:1;min-width:0;display:grid;gap:2px}
.chev{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-1px}
.chev.l{transform:scaleX(-1)}
.chev.d{transform:rotate(90deg)}
.btn .chev{margin:0 3px}
.theory .th-chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;color:var(--bleu);font-size:1.1rem;transition:transform .2s}
.theory .th-chev .chev{transition:transform .2s}
.theory[open] .th-chev .chev{transform:rotate(-90deg)}
.theory .th-tag{color:var(--bleu);font-size:.85rem;font-weight:600;margin-top:4px}
.theory .th-lv{font-weight:800;font-size:1.15rem;color:var(--ink)}
.theory .th-ru{color:var(--soft);font-size:.95rem}
.theory.titleonly{padding:12px 14px}
.theory-body{font-size:.98rem;line-height:1.5}
.theory-body p{margin:.5em 0}
.theory-body ul{margin:.4em 0;padding-left:1.1em}
.theory-body li{margin:.65em 0;line-height:1.4}
.theory-body .r{display:block}
.theory-body .ex{display:block;margin-top:.15em;font-weight:600;color:var(--bleu)}
.known{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:40px;padding:0 10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-weight:600;font-size:.9rem;line-height:1.1;cursor:pointer}
.known input{width:20px;height:20px;margin:0;accent-color:var(--ok);cursor:pointer}
.item.done .known{border-color:var(--ok);background:var(--paper)}
.known:focus-within{outline:3px solid var(--rouge);outline-offset:2px}
.forgot-mark input{accent-color:var(--warn)}
.item.forgot{border-color:var(--warn);background:var(--warnbg)}
.item.forgot .num{background:var(--warn);color:#fff;border-color:var(--warn)}
.item.forgot .forgot-mark{border-color:var(--warn);background:var(--paper)}
.substages{display:flex;gap:18px;overflow-x:auto;padding:2px;border-bottom:1px solid var(--line)}
.recap-lv{margin:14px 2px 6px;font-size:1rem;color:var(--bleu)}
.recap-intro{margin-bottom:10px}
.story{margin-top:14px}
.story-p{margin:12px 0;padding-top:10px;border-top:1px dashed var(--line)}
.story-p .lvtag{font-size:.85rem;font-weight:700;color:var(--soft)}
.story-p .fr{font-size:1.15rem;line-height:1.5;margin:.3em 0 .5em}
.story-p details.tr summary{cursor:pointer;color:var(--bleu);font-weight:600}
.story-p details.tr p{margin:.4em 0 0;color:var(--soft)}
.hint{color:var(--soft);font-size:.95rem;margin:0 0 4px}

.fb{border-radius:12px;padding:8px 12px;font-size:.98rem}
.fb.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.fb.bad{background:var(--badbg)}
.fb .said{margin:2px 0}
.w-ok{color:var(--ok);font-weight:600}
.w-bad{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.w-extra{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.tip{margin-top:6px;color:var(--ink)}
.fb .said{font-size:1.12rem;margin:2px 0 4px}
.fb .lbl{font-size:.9rem;color:var(--soft);font-weight:400}
.fb.ok .said{color:var(--ink);font-weight:400}
.fb.live{background:var(--bg);font-size:1.1rem}
.fb .note{font-size:.9rem;color:var(--soft);font-weight:400;margin-top:2px}
.w-near{color:#C77700;font-weight:600;text-decoration:underline dotted}
.w-dim{color:var(--soft)}
.tip::before{content:"🐈 "}

.opts{display:grid;gap:6px}
.opt{font:inherit;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through}
.q{font-size:1.15rem;font-weight:600}

.wrap>*{min-width:0}
.levelnav{display:flex;gap:6px;margin:10px 0 4px}
.levelnav button{flex:none;width:46px;min-height:46px;font:inherit;font-size:1.4rem;line-height:1;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;cursor:pointer}
.levelnav button:disabled{opacity:.4;cursor:not-allowed}
.levelnav select{flex:1;min-width:0;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;min-height:46px;padding:0 8px}
.levelnav button:focus-visible,.levelnav select:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
.voicebox{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px;min-width:0}
.voicebox .lbl{font-size:.9rem;color:var(--soft)}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;font:inherit;font-size:.88rem;line-height:1.15;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-height:46px;padding:4px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button:focus-visible,.voicerow select:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
.voicerow{display:flex;gap:6px}
.voicerow select{flex:1;min-width:0;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;min-height:46px;padding:0 8px}
.voicerow .btn{flex:none;min-height:46px}
.voicerow .vn{flex:none;align-self:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-content:center;font-size:.8rem;font-weight:600}
.gap{display:inline-block;width:5.5em;height:1.05em;border-bottom:3px solid var(--bleu);vertical-align:-.12em;margin:0 .2em}
.gapword{color:var(--ok);font-weight:700;border-bottom:3px solid var(--ok)}
.dictrow{display:flex;gap:8px;flex:1 1 100%}
.dictrow input{flex:1;min-width:0;min-height:54px;font-size:1.1rem}
.dictrow .btn{flex:none;min-width:64px}
.listen-row{display:flex;gap:8px;flex:0 0 auto}
.actions .listen-row{flex:1 1 100%}
.listen-row .btn{flex:1 1 0;min-width:0}
.notice{background:var(--badbg);border-radius:14px;padding:10px 14px}

.aqua{position:relative;border-radius:24px 24px 18px 18px;overflow:hidden;border:3px solid var(--ink);background:var(--bg)}
.aqua svg{display:block;width:100%;height:auto}
.aqua-empty{position:absolute;right:10px;top:12px;width:44%;text-align:center;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px 14px 4px 14px;font-weight:500;font-size:.85rem;line-height:1.25;z-index:3;padding:6px 10px}
.paw{animation:pat 5s ease-in-out infinite}
@keyframes pat{0%,34%{transform:rotate(-24deg)}46%{transform:rotate(4deg)}51%{transform:rotate(-7deg)}56%{transform:rotate(4deg)}61%{transform:rotate(-7deg)}66%{transform:rotate(4deg)}80%,100%{transform:rotate(-24deg)}}
.poke{transform-box:fill-box;transform-origin:center;animation:wig 5s ease-in-out infinite}
@keyframes wig{0%,45%{transform:none}50%{transform:translateY(-3px) rotate(-14deg)}56%{transform:translateY(0) rotate(9deg)}62%{transform:translateY(-3px) rotate(-10deg)}68%{transform:translateY(0) rotate(6deg)}74%,100%{transform:none}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 4s ease-in-out infinite alternate}
@keyframes breath{from{transform:scaleY(1)}to{transform:scaleY(1.035)}}
.win{text-align:center;padding:24px 16px}
.win .big{font-size:3rem}
details summary{cursor:pointer;color:var(--soft);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}

.player{position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column}
.pl-top{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;background:var(--paper);border-bottom:2px solid var(--line)}
.pl-row{display:flex;align-items:center;gap:10px}
.pl-x{flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.25rem;cursor:pointer}
.pl-title{flex:1;min-width:0;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:1rem}
.pl-bar{height:14px;border-radius:99px;background:var(--bg);border:2px solid var(--line);overflow:hidden;margin-top:12px}
.pl-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bleu),var(--rouge));transition:width .3s}
.pl-body{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.pl-inner{width:100%;max-width:680px;margin:auto auto 0}
.pl-inner.top{margin:0 auto}
.pl-bottom{margin:12px 0 0}
.pl-bottom .row{display:flex;gap:8px}
.pl-bottom .row .btn{flex:1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pl-bottom:empty{display:none}
.player.browse .marks{display:none}
.stagecard{margin-bottom:12px}
.screen{display:grid;gap:14px;min-width:0}
.home-h{font-size:1.15rem;margin:4px 2px 0}
.lvtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lvtop .btn{min-height:44px;padding:8px 12px}
.lvtop #recapBtn{margin-left:auto}
.lvtop .cat{font-size:34px}
.lv-item{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lv-item.cur{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet) inset}
.lv-item .lv-card{border:none;border-radius:0;background:transparent}
.lv-rap .lv-sw{background:transparent}
.lv-sw{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:.8rem;font-weight:600;color:var(--soft)}
.lv-sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw-track{flex:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw-track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.lv-sw input:checked + .sw-track{background:var(--ok)}
.lv-sw input:checked + .sw-track::after{transform:translateX(20px)}
.lv-sw input:focus-visible + .sw-track{outline:3px solid var(--rouge);outline-offset:2px}
.sw-gain{margin-left:auto;color:var(--soft);font-weight:700;white-space:nowrap;font-size:.85rem}
.sw-ck{color:var(--ok);font-size:1rem}
.lv-rap{background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lv-rap.done{border-color:var(--ok)}
.lv-rapcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;border:none;padding:12px 14px;cursor:pointer}
.lv-rapcard .rapsp{flex:none;width:44px}
.lv-rapcard .raptxt{flex:1;min-width:0;display:grid;gap:1px}
.lv-rapcard .raptxt b{font-size:1rem;line-height:1.25}
.lv-rapcard .raptxt small{color:var(--soft);font-size:.9rem}
.progwrap{display:flex;align-items:center;gap:12px;margin:0 2px}
.progwrap .bar{flex:1}
#stageHost{display:flex;flex-direction:column;gap:0}
#plHost{margin-top:auto}
#plBottom{margin-top:12px}
.aquapanel{padding:10px;margin-bottom:12px}
.settings-h{font-size:1.1rem;margin:0 0 6px}
.lvbtn{width:100%;margin:10px 0 4px;min-height:52px;font-size:1.05rem}
.btn.cta{position:relative;overflow:hidden;font-size:1.3rem;padding:20px 18px;min-height:70px;border-radius:20px;letter-spacing:.02em;color:#fff;
  background:linear-gradient(115deg,#6A38C2 0,#8B5CF6 25%,#D946EF 50%,#6366F1 75%,#6A38C2 100%);background-size:420px 100%;animation:ctaflow 4s linear infinite;
  box-shadow:0 8px 20px rgba(106,56,194,.38);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.btn.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-130%);animation:ctashine 3.2s ease-in-out infinite;pointer-events:none}
.btn.cta:active{transform:scale(.98)}
.btn.cta:disabled{animation:none;filter:grayscale(.6);opacity:.7}.btn.cta:disabled::after{animation:none}
@keyframes ctaflow{to{background-position:-420px 0}}
@keyframes ctashine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@media (prefers-reduced-motion:reduce){.btn.cta,.btn.cta::after{animation:none}}
.lv-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer}
.lv-card .lvnum{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg);border:2px solid var(--line)}
.lv-item.done .lvnum{background:var(--ok);color:#fff;border-color:var(--ok)}
.lv-card .lvtxt{flex:1;min-width:0;display:grid;gap:2px}
.lv-card .lvtxt b{font-size:1.12rem;line-height:1.25}
.lv-card .lvtxt small{color:var(--soft);font-size:.96rem}
.lvgo{flex:none;display:grid;place-items:center;color:var(--soft)}
.lv-card .lvbar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.lv-card .lvbar span{display:block;height:100%;background:linear-gradient(90deg,var(--bleu),var(--rouge))}
.lv-card .lvst{flex:none;font-weight:700;color:var(--soft);font-size:.9rem}
.lv-list{display:grid;gap:10px;margin-top:14px}
.theory-body .ex .tr{display:block;font-weight:400;color:var(--soft);font-size:.93rem;margin-top:.1em}
.theory-body .ex .say{display:inline-grid;place-items:center;width:34px;height:34px;margin-left:8px;vertical-align:middle;border:2px solid var(--line);border-radius:50%;background:var(--bg);font-size:1rem;cursor:pointer;padding:0}

1:{t:"Je veux + число + предмет",intro:"<b>Je veux</b> значит «я хочу». Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["Глагол vouloir (хотеть) меняется по лицам","je veux, tu veux, il veut"],
["Глагол vouloir (хотеть) по лицам","je veux, tu veux, il / elle veut, nous voulons, vous voulez, ils / elles veulent"],
["Он это il, она это elle. Они это ils (мужчины или смешанная группа) или elles (только женщины)","Il veut quarante-deux courgettes. Elles veulent quatre-vingt-trois bouteilles de lait."],
["После Je veux называем число и предмет","Je veux trois bananes."],
["«Один» это un (мужской род) или une (женский). Род учим вместе со словом","un croissant, une pomme"],
["Если предметов несколько, к слову добавляется -s, но на слух его не слышно","une pomme — deux pommes"],
["Числа 1–16 учим как есть","un, deux, trois, quatre, cinq, six, sept, huit, neuf, dix, onze, douze, treize, quatorze, quinze, seize"],
["17–19 это «десять и …»","dix-sept, dix-huit, dix-neuf"],
["Десятки 20, 30, 40, 50, 60","vingt, trente, quarante, cinquante, soixante"],
["Между десятками и единицами дефис","vingt-deux, trente-six, quarante-deux"],
["А 21, 31, 41, 51, 61 и 71 пишутся с et","vingt et un, soixante et onze"],
["70 это 60+10, 80 это 4×20, 90 это 4×20+10","soixante-dix, quatre-vingts, quatre-vingt-dix"],
["Числа после 80 идут через дефис","quatre-vingt-un, quatre-vingt-trois, quatre-vingt-dix-neuf"],
["Сто","cent"],
["Отрицание ставится вокруг глагола ne … pas","Je ne veux pas douze crevettes."],
["Если предмет без числа, то un / une / du меняются на de (перед гласной d')","Je ne veux pas de pomme."],
["Вопрос задаём интонацией и меняем лицо на tu (ты). Перед знаком ? во французском ставим пробел","Tu veux douze crevettes ?"],
["Прилагательное говорит, какой предмет. Оно согласуется со словом: женский род получает -e, множественное число -s", "une belle pomme, de petites courgettes, de bonnes baguettes"],
["Часть прилагательных стоит перед словом. Это красивый, маленький, большой, хороший, новый, старый, молодой", "beau, petit, grand, gros, bon, nouveau, vieux, jeune"],
["Beau и nouveau во множественном числе мужского рода получают -x", "quatre-vingt-six beaux baisers, de nouveaux amis"],
["Остальные прилагательные стоят после слова", "du lait frais, une pomme rouge"]]},
2:{t:"J'ai… (у меня есть…)",intro:"<b>J'ai</b> значит «у меня есть» (буквально «я имею»). Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["Глагол avoir","j'ai, tu as, il a"],
["Глагол avoir по лицам","j'ai, tu as, il / elle a, nous avons, vous avez, ils / elles ont"],
["По-русски «у него, у неё, у нас, у них», а по-французски меняется только форма avoir","Il a soixante et onze euros. Nous avons deux cent cinquante grammes de beurre."],
["Возраст про него или про неё тоже с avoir","Elle a vingt-huit ans."],
["Несколько предметов называем с числом и добавляем -s","J'ai vingt-trois voitures."],
["Меру, вес и объём соединяем с предметом словом de","deux litres de lait, deux cent cinquante grammes de beurre"],
["Возраст по-французски «имеют»","J'ai vingt-huit ans. (мне 28 лет)"],
["Сотни пишутся с -s, если после них нет числа","deux cents euros"],
["Если после сотен есть число, то -s нет","deux cent cinquante grammes"],
["Отрицание ставится вокруг avoir (перед гласной n')","Je n'ai pas vingt-trois voitures."],
["С числом артикль не нужен","Je n'ai pas douze euros."],
["Без числа вместо un / une / des ставим de или d'","Je n'ai pas de sœur. Je n'ai pas d'amis."],
["По-русски после «нет» слово стоит в родительном падеже","нет сестры, нет двенадцати евро"],
["Вопрос с tu as (у тебя есть). Возраст спрашиваем так же","Tu as vingt-trois voitures ? Tu as vingt-huit ans ?"],
["Прилагательные на -e одинаковы для мужского и женского рода", "une voiture rouge, un sac rouge"],
["Если прилагательное уже оканчивается на -s, во множественном числе оно не меняется", "du bœuf frais, des voitures grises"],
["Frais в женском роде это fraîche", "du bœuf frais, de la crème fraîche"],
["Причастие работает как прилагательное и согласуется со словом", "une réservation confirmée, deux réservations confirmées"],
["Мера, потом de, потом продукт и его прилагательное", "cent cinquante grammes de bœuf frais, deux cent cinquante grammes de beurre salé"]]},
3:{t:"Je prends… (я беру…)",intro:"<b>Je prends</b> значит «я беру». Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[

["Dernier (последний) и prochain (следующий) стоят перед словом", "le dernier bus, le prochain train"],

["Цвета стоят после слова и не стоят перед ним", "un café noir, du jambon blanc, une table blanche"],

5:{t:"Je cherche… (я ищу…)",intro:"<b>Je cherche</b> значит «я ищу». Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[

["Окончания -e, -es, -ent на слух почти не слышны, поэтому форму выдаёт местоимение","Il cherche la chambre trente-deux. Elles cherchent un appartement."],
["Начать можно с Excusez-moi (извините)","Excusez-moi, je cherche l'hôtel."],
["Расстояние называем через à","un café à deux cents mètres, un supermarché à deux kilomètres"],
["Площадь в квадратных метрах","cinquante mètres carrés"],
["Номера говорим словами и ставим в конце","la chambre trente-deux, le quai neuf"],
["Отрицание ставится вокруг cherche","Je ne cherche pas la gare."],
["Без числа un / une / des меняются на de или d'","Je ne cherche pas de travail. Je ne cherche pas d'appartement."],
["Слова la, le, mon и меры остаются","Je ne cherche pas mon sac. Je ne cherche pas un kilo de farine."],
["Вопрос на «вы» меняет cherche на cherchez, а mon / ma / mes на votre / vos","Vous cherchez la gare ?"],
["На -al оканчиваются многие прилагательные места. Во множественном числе они получают -aux", "central, centrale, centraux"],
["Ouvert и fermé согласуются со словом", "une pharmacie ouverte, un magasin fermé"],
["Перед гласной bel и vieil вместо beau и vieux", "un bel appartement, un vieil hôtel"],
["Calme (спокойный) и petit (маленький) полезны для поиска места", "un café calme, un petit hôtel"]]},
6:{t:"Je peux… / Je ne peux pas…",intro:"<b>Je peux</b> значит «я могу». Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["Глагол pouvoir (мочь)","je peux, tu peux, il peut"],
["Глагол pouvoir по лицам","je peux, tu peux, il / elle peut, nous pouvons, vous pouvez, ils / elles peuvent"],
["После любого лица второй глагол остаётся в начальной форме","Il peut avoir un café. Elles peuvent marcher trois kilomètres."],
["После него стоит глагол в начальной форме","Je peux payer. Je peux venir."],
["Je peux avoir … значит «я могу получить …»","Je peux avoir un café."],
["Просьбу «Можно мне …?» говорят так же, но вопросом. Перед знаком ? во французском ставят пробел","Je peux avoir un café ?"],
["Для вещей, которые не считаем штуками, берём du / de la / de l'","du fromage, du lait"],
["Отрицание ставится вокруг peux","Je ne peux pas payer."],
["После отрицания du / un / une меняются на de","Je ne peux pas manger de fromage. Je ne peux pas avoir de table."],
["Вопрос с tu peux (ты можешь)","Tu peux payer ?"],
["Прилагательное идёт после продукта и согласуется с ним", "du fromage frais, deux tartes chaudes"],
["Налить кому-то (verser) с местоимением me или te", "Je peux te verser du kéfir. Tu peux me verser du kéfir ?"],
["Мера, de и продукт с прилагательным", "cent millilitres de kéfir froid, trente centilitres de lait chaud"],
["Long (долгий) стоит перед словом, в женском роде это longue", "vingt longues minutes, un long trajet"]]},
7:{t:"Je vais + глагол (я собираюсь…)",intro:"<b>Je vais</b> и глагол в начальной форме значит «я собираюсь». Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["Глагол aller (идти, ехать)","je vais, tu vas, il va"],
["Глагол aller по лицам","je vais, tu vas, il / elle va, nous allons, vous allez, ils / elles vont"],
["Меняется только aller, а второй глагол остаётся в начальной форме","Il va marcher trois kilomètres. Nous allons courir dix kilomètres."],
["Je vais + глагол это ближайшее будущее","Je vais manger."],
["Второй глагол не меняется","Je vais acheter deux billets."],
["Числа, меры и расстояния стоят как в обычной фразе","Je vais marcher trois kilomètres."],
["Часто добавляют время","demain, ce soir"],
["Отрицание ставится вокруг vais, а второй глагол остаётся","Je ne vais pas manger."],
["Вопрос с tu vas (ты собираешься)","Tu vas manger ?"],
["Bon (хороший) в женском роде это bonne", "une bonne soupe, un bon café"],
["Nouveau (новый) в женском роде это nouvelle, во множественном nouveaux", "deux nouveaux billets, une nouvelle carte"],
["Vieux (старый) в женском роде это vieille", "le vieux musée, la vieille ville"],
["Joli и grand (красивый и большой) стоят перед словом", "un joli cadeau, dix grandes bouteilles"]]},
8:{t:"J'ai + причастие (я сделала…)",intro:"<b>Passé composé</b> это прошедшее время. Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["Оно состоит из J'ai и причастия (особой формы глагола)","J'ai mangé."],
["Вспомогательный avoir по лицам","j'ai, tu as, il / elle a, nous avons, vous avez, ils / elles ont"],
["Причастие не меняется, а меняется только avoir","Il a marché. Nous avons commandé. Elle a oublié."],
["Глаголы на -er получают -é","manger → mangé, acheter → acheté, travailler → travaillé"],
["Глаголы на -re часто получают -u","attendre → attendu, perdre → perdu"],
["Неправильные нужно запомнить","prendre → pris, lire → lu, écrire → écrit, faire → fait"],
["После J'ai причастие обычно не меняется по роду и числу","J'ai pris le bus."],
["Отрицание ставится вокруг J'ai, причастие остаётся после","Je n'ai pas mangé."],
["Без числа un / une меняются на de","Je n'ai pas commandé de pizza."],
["Вопрос с tu as и причастием. Слова mon / ma / mes в вопросе становятся ton / ta / tes","Tu as mangé ? Tu as oublié ton téléphone ?"],
["Прилагательное при существительном в passé composé работает как обычно", "J'ai mangé un gros gâteau. Nous avons commandé une grande pizza."],
["Bon marché (дешёвый) никогда не меняется", "des billets bon marché, une robe bon marché"],
["Передавая рассказ, добавляем прилагательные, чтобы он был живым", "J'ai acheté une belle robe. Il a oublié son nouveau téléphone."]]},
9:{t:"Je suis… (я…)",intro:"<b>Je suis</b> от глагола être. Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["Глагол être (быть)","je suis, tu es, il est"],
["Глагол être по лицам","je suis, tu es, il / elle est, nous sommes, vous êtes, ils / elles sont"],
["Слово после être согласуется. Женский род с -e, множественное число с -s","il est fatigué, elle est fatiguée, nous sommes libres, elles sont fatiguées"],
["В русском «есть» пропускают, а во французском suis нужен всегда","Je suis fatiguée."],
["Для женщины добавляем -e","fatiguée, contente, occupée, perdue"],
["Профессия и роль идут без артикля","Je suis étudiante. Je suis touriste."],
["Место передают через à, au (= à + le) и dans","à Nice, à l'hôtel, au troisième étage, dans le bus"],
["Расстояние через à и de","à dix kilomètres de Nice"],
["Отрицание ставится вокруг suis","Je ne suis pas fatiguée."],
["Вопрос с tu es (ты). Женский род остаётся","Tu es fatiguée ?"],
["После être прилагательное согласуется с тем, кто говорит", "Je suis fatiguée (девушка). Il est fatigué. Nous sommes heureux."],
["Très (очень) стоит перед прилагательным", "très fatiguée, très gentil"],
["Некоторые прилагательные меняются в женском роде сильнее", "gentil — gentille, heureux — heureuse, content — contente"],
["Contente de (довольна чем-то) идёт с de", "Je suis contente de ma nouvelle chambre."]]},
10:{t:"Il y a… (есть, имеется)",intro:"<b>Il y a</b> значит «есть, имеется». Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["Il y a звучит одинаково для одного предмета и для многих","Il y a un café. Il y a trois chambres."],
["Il y a не меняется по лицам. Его не путаем с il est («он находится»)","Il y a un café. Il est ici."],
["Elle est и ils sont тоже говорят о месте, в котором кто-то находится","Elle est là. Ils sont là-bas."],
["Вопрос делается интонацией","Il y a un parc ?"],
["Расстояние называем через à","Il y a un parc à deux kilomètres."],
["Отрицание Il n'y a pas","Il n'y a pas trois chambres."],
["Без числа после pas всегда de (перед гласной d')","Il n'y a pas de café. Il n'y a pas d'ascenseur."],
["По-русски после «нет» слово стоит в родительном падеже","нет кафе, нет банка, нет трёх комнат"],
["Вопрос получается из той же фразы интонацией. Можно добавить Est-ce qu'","Il y a un café ? Est-ce qu'il y a un café ?"],
["После il y a прилагательное стоит как обычно", "Il y a un bon café, une petite banque, trois grandes chambres."],
["Перед гласной bel, vieil, nouvel", "un bel hôtel, un vieil ami, un nouvel ami"],
["Во множественном числе перед словом petit и grand получают -s", "leurs petits enfants, de grandes chambres"],
["Jeune (молодой) одинаково для мужского и женского рода", "un jeune ami, une jeune amie"]]},
11:{t:"В приложении: покупки",intro:"Слова и фразы из магазинов в приложениях. Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["На кнопках глагол стоит в начальной форме","Ajouter au panier. Payer. Rechercher un produit."],
["Глагол avoir по лицам","j'ai, tu as, il / elle a, nous avons, vous avez, ils / elles ont"],
["Глагол vouloir в третьем лице множественного числа","ils / elles veulent"],
["sa, notre, leur значат «его или её, наш, их»","Elle a reçu sa commande. Nous avons payé notre achat."],
["Отрицание на кнопке делается словами Ne pas перед начальной формой","Ne pas ajouter au panier."],
["Слова","le panier — корзина, la commande — заказ, l'achat — покупка, le produit — товар, la livraison — доставка, le code promo — промокод"],
["au = à + le, aux = à + les","au panier, aux favoris"],
["disponible значит «в наличии», с отрицанием «нет в наличии»","Le produit n'est pas disponible."],
["После отрицания un / une меняются на de","Ne pas rechercher de produit. Ne pas entrer de code promo."],
["Окно подтверждения начинается с Voulez-vous (хотите) и начальной формы глагола","Voulez-vous ajouter au panier ?"],
["Nouveau (новый) и dernier (последний) стоят перед словом", "le nouveau produit, mon dernier achat"],
["Urgent (срочный) стоит после слова", "une commande urgente"],
["Цвет стоит после слова", "le produit rouge, le sac bleu"]]},
12:{t:"В приложении: аккаунт и настройки",intro:"Слова и фразы из аккаунта и настроек. Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["Возвратные глаголы с se. В кнопке se остаётся как есть","Se connecter. Se déconnecter."],
["Возвратный глагол se souvenir по лицам","je me souviens, tu te souviens, il / elle se souvient, nous nous souvenons, vous vous souvenez, ils / elles se souviennent"],
["Глагол avoir (il a) и vouloir (elles veulent)","Il a un compte. Elles veulent des notifications."],
["Отрицание делается словами Ne pas, а se остаётся после","Ne pas se connecter."],
["Слова","un compte — аккаунт, un mot de passe — пароль, les paramètres — настройки, les notifications — уведомления"],
["mon / ma / mes значит «мой, моя, мои»","mon profil, ma commande, mes adresses"],
["Глаголы","activer — включить, désactiver — отключить, autoriser — разрешить, supprimer — удалить"],
["В обычной речи отрицание ставится вокруг глагола ne … pas","Je n'accepte pas les conditions. Je ne veux pas de notifications."],
["du в этой фразе это de + le","Je ne me souviens pas du mot de passe."],
["Вопрос о действии начинается с Voulez-vous (хотите). Вопрос к другу начинается с tu","Voulez-vous vous connecter ? Tu as un compte ?"],
["Personnel (личный), actuel (текущий), gratuit (бесплатный), important (важный) стоят после слова", "un compte personnel, le mot de passe actuel, un compte gratuit, des notifications importantes"],
["Nouveau (новый) и long (длинный) стоят перед словом", "un nouveau compte, un long mot de passe"]]},
13:{t:"В приложении: кнопки и сообщения",intro:"Короткие слова и сообщения из интерфейса. Каждая фраза идёт тремя карточками подряд: утверждение, отрицание и вопрос.",rules:[
["Названия разделов (существительные)","Accueil, Retour, Aide"],
["Глагол comprendre по лицам","je comprends, tu comprends, il / elle comprend, nous comprenons, vous comprenez, ils / elles comprennent"],
["Глагол trouver (находить)","nous trouvons, ils trouvent"],
["Действия на кнопках в начальной форме","Valider, Enregistrer, Supprimer, Partager, Télécharger"],
["Запрет действия делается словами Ne pas","Ne pas enregistrer. Ne pas fermer."],
["Сообщения системы","Chargement en cours — идёт загрузка. Aucun résultat — ничего не найдено"],
["Если что-то не получается, говорим с ne … pas","Je ne comprends pas. Je ne trouve pas le bouton."],
["В сообщении отрицание ставится вокруг глагола","La connexion ne fonctionne pas. Il n'y a pas d'erreur."],
["Вопрос о действии начинается с Voulez-vous. Вопрос о состоянии с Est-ce que","Voulez-vous enregistrer ? Est-ce que la connexion fonctionne ?"],
["Final (итоговый) стоит после слова. Ancien (старый) и bon (нужный, правильный) перед словом", "le document final, l'ancien message, le bon bouton"],
["Dernier (последний) и long (длинный) стоят перед словом", "la dernière version, le long message"],
["Nouveau (новый) в женском роде это nouvelle", "la nouvelle adresse"]]}
};

// транскрипция французских слов русскими буквами. Русские пояснения в примерах пропускаются
function frOnly(t){
  t=t.replace(/\([^)]*\)/g,"").replace(/\s*—\s*[\u0400-\u04FF][^,.;]*/g,"").replace(/[\u0400-\u04FF]+/g,"").replace(/\s+/g," ").replace(/\s+([,.;?!])/g,"$1").replace(/[\s,;—-]+$/,"").trim();
  return /[A-Za-zÀ-ÿŒœ]/.test(t)?t:"";
}
function frTrans(t){
  const out=t.replace(/[A-Za-zÀ-ÿŒœ]+(?:['’-][A-Za-zÀ-ÿŒœ]+)*/g,w=>{
    const k=w.toLowerCase().replace(/’/g,"'"); if(TR[k]!==undefined) return TR[k];
    const parts=k.split(/(?<=['-])|(?=-)/); return parts.map(x=>{ const c=x.replace(/^-/,""); return TR[c]!==undefined?TR[c]:(TR[x]!==undefined?TR[x]:x); }).join("");
  });
  return out.charAt(0).toUpperCase()+out.slice(1);
}
function theoryHtml(th){
  return '<p>'+th.intro+'</p><ul class="rules">'+th.rules.map(r=>{
    let ex="";
    if(r[1]){
      const fr=frOnly(r[1]);
      ex='<span class="ex" lang="fr">'+r[1]+(fr?'<button type="button" class="say" data-say="'+esc(fr)+'" aria-label="Озвучить пример">🔊</button><span class="tr">'+esc(frTrans(fr))+'</span>':'')+'</span>';
    }
    return '<li><span class="r">'+r[0]+'</span>'+ex+'</li>';
  }).join("")+'</ul>';
}

/* ---------- CHECKING ---------- */
const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const TENS={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
// digits from speech recognition -> French words; a final "1" becomes "§1" (= un OR une)
function numFr(n){
  if(n<20) return n===1?"§1":U[n];
  if(n>=1000) return String(n);
  if(n>=100){ const h=Math.floor(n/100), r=n%100, c=h===1?"cent":U[h]+" cent"+(r===0?"s":""); return r?c+" "+numFr(r):c; }
  const t=Math.floor(n/10), u=n%10;
  if(t<=6) return TENS[t]+(u===0?"":u===1?" et §1":"-"+U[u]);
  if(t===7) return "soixante"+(u===1?" et onze":"-"+U[10+u]);
  if(t===8) return u===0?"quatre-vingts":"quatre-vingt-"+(u===1?"§1":U[u]);
  return "quatre-vingt-"+U[10+u];
}
const FILLERS=new Set(["euh","heu","bah","ben","hum","mmm"]);
function tokens(s){
  return s.toLowerCase().replace(/\d+/g,d=>" "+numFr(+d)+" ").replace(/[’`´]/g,"'").replace(/œ/g,"oe").replace(/æ/g,"ae")
    .replace(/[.,!?;:«»"()…]/g," ").replace(/-/g," ").replace(/'/g,"")
    .split(/\s+/).filter(w=>w && !FILLERS.has(w));
}
function deaccent(w){return w.normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function sound(w){ w=deaccent(w); return w.length>3 ? w.replace(/(ent|es|s|x|t|e)$/,"") : w.replace(/[sxt]$/,""); }
// "exact" | "near" (sounds the same) | "accent" (typed, accents differ) | false
function eq(t, s, mode){
  if(t===s) return "exact";
  if(s==="§1" && (t==="un"||t==="une")) return "exact";
  if(deaccent(t)===deaccent(s)) return mode==="speech" ? "near" : "accent";
  if(mode==="speech" && sound(t)===sound(s)) return "near";
  return false;
}
function check(target, said, mode){
  const T=tokens(target);
  const saidWords=said.trim().split(/\s+/), owner=[], S=[];
  saidWords.forEach((w,wi)=>tokens(w).forEach(tk=>{S.push(tk);owner.push(wi);}));
  const n=T.length, m=S.length, L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) L[i][j]= eq(T[i],S[j],mode) ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const tOk=Array(n).fill(false), sType=Array(m).fill(false);
  let i=0,j=0; while(i<n&&j<m){ const e=eq(T[i],S[j],mode); if(e){ tOk[i]=true; sType[j]=e; i++;j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  const ok = tOk.every(Boolean) && sType.every(Boolean);
  const near = sType.some(x=>x==="near"), accent = sType.some(x=>x==="accent");
  // target words
  const shown=target.replace(/-/g," ").split(/\s+/);
  let k=0; const tHtml=shown.map(w=>{ const parts=tokens(w); if(!parts.length) return esc(w); let good=true; parts.forEach(()=>{ if(!tOk[k++]) good=false; }); return '<span class="'+(good?"w-ok":"w-bad")+'">'+esc(w)+'</span>'; }).join(" ");
  // what she actually said, word by word
  const sHtml=saidWords.map((w,wi)=>{
    const types=sType.filter((_,x)=>owner[x]===wi);
    if(!types.length) return '<span class="w-dim">'+esc(w)+'</span>';
    const cls = types.includes(false) ? "w-extra" : types.some(t=>t==="near"||t==="accent") ? "w-near" : "w-ok";
    return '<span class="'+cls+'">'+esc(w)+'</span>';
  }).join(" ");
  return {ok, near, accent, tHtml, sHtml};
}

  el.textContent="Marcel réfléchit…";
  const prompt = `Ты Марсель — дружелюбный французский кот, преподаватель французского для начинающей ученицы, объясняешь по-русски.

function listen(btn, onText, onLive){

  let got="", heard="", timer=null;
  // не обрываем на первой паузе: останавливаемся, когда тишина длится дольше
  const arm=ms=>{ clearTimeout(timer); timer=setTimeout(()=>{ try{me.stop();}catch(e){} }, ms); };
  me.onstart=()=>{btn.classList.add("listening");btn.textContent="⏹ Stop"; if(onLive) onLive("…"); arm(8000);};

/* ---------- диктант: слушаем фразу и вписываем пропущенное слово ---------- */
const GAP_STOP=new Set(["je","tu","il","elle","on","nous","vous","ils","elles","le","la","les","un","une","l","d","j","n","m","t","s","c","qu","ne","à","et","ou","en","y"]);
const GAP_SMALL=new Set(["pas","de","du","des"]);
// слово для пропуска выбирается по номеру карточки, поэтому в разных карточках оно разное и не меняется при перезагрузке
function gapCands(fr){
  const parts=fr.match(WORD_RE)||[], runs=frRuns(parts), inRun=new Set(); runs.forEach(r=>{ for(let k=r.from;k<=r.to;k++) inRun.add(k); });
  const cands=[], seen=new Set();
  const add=(from,to)=>{ const key=parts.slice(from,to+1).join("").toLowerCase(); if(seen.has(key)) return; seen.add(key); cands.push({from,to,key}); };
  runs.forEach(r=>{ if(r.value>=2) add(r.from,r.to); });
  parts.forEach((p,i)=>{ if(!isWord(p)||inRun.has(i)) return; const lw=p.toLowerCase(); if(GAP_STOP.has(lw)) return; if(GAP_SMALL.has(lw)||lw.length>=2) add(i,i); });
  if(!cands.length){ const w=parts.map((p,i)=>isWord(p)?i:-1).filter(i=>i>=0); if(!w.length) return {parts,cands:[]}; const i=w[w.length-1]; cands.push({from:i,to:i,key:parts[i].toLowerCase()}); }
  const extra=[]; parts.forEach((p,i)=>{ const lw=p.toLowerCase(); if(isWord(p)&&p.length>=2&&!seen.has(lw)&&!inRun.has(i)){ seen.add(lw); extra.push({from:i,to:i,key:lw}); } });
  return {parts,cands,extra};
}
function pickGap(fr,idx){
  // карточки идут тройками (утверждение, отрицание, вопрос). Слова выбираются по очереди и не повторяются внутри тройки.
  // Частые слова (veux, pas) берутся в последнюю очередь, чтобы пропуск не был всегда один и тот же.
  const d=levelData(state.level), g0=idx-idx%3, used=new Set(); let res=null;
  const COMMON=new Set(["pas","veux","veut","peux","peut","voudrais","ai","as","a","suis","est","sont","fais","vais","va","avez","avons","est-ce","de","du","des","d"]);
  for(let j=g0;j<=idx;j++){
    const src=j===idx?fr:(d&&d.phrases[j]?d.phrases[j][0]:fr), {parts,cands,extra}=gapCands(src);
    if(!cands.length){ if(j===idx) return null; continue; }
    const h=((Math.floor(j/3)+1)*2654435761 + state.level*40503 + (j%3)*97)>>>0;
    const fresh=cands.filter(c=>!used.has(c.key)), rare=fresh.filter(c=>!COMMON.has(c.key));
    const spare=extra.filter(c=>!used.has(c.key)), pool=rare.length?rare:(fresh.length?fresh:(spare.length?spare:cands));
    const c=pool[h%pool.length]; used.add(c.key);
    if(j===idx) res={before:parts.slice(0,c.from).join(""), word:parts.slice(c.from,c.to+1).join(""), after:parts.slice(c.to+1).join("")};
  }
  return res;
}
function dictNorm(x){ return x.trim().toLowerCase().replace(/[’`´]/g,"'").replace(/œ/g,"oe").replace(/\s+/g," "); }

  const g=pickGap(fr,idx)||{before:"",word:fr,after:""};
  const el=document.createElement("article"); el.className="item sp dict"+(isForgot?" forgot":done?" done":"");
  const gapHtml=settled ? '<span class="gapword">'+esc(g.word)+'</span>' : '<span class="gap" role="img" aria-label="пропущенное слово"></span>';
  el.innerHTML='<div class="item-top"><div class="num">'+(isForgot?"↻":done?"✓":(n||idx+1))+'</div><div class="texts">'+
    '<div class="fr dictfr" lang="fr">'+esc(g.before)+gapHtml+esc(g.after)+'</div>'+(settled?'<div class="ru">'+esc(ru)+'</div>':'')+'</div></div><div class="actions"></div><div class="fbwrap"></div>';

  };

    if(k==="rev_fin"){ setAgain(k,idx,fc.checked); if(fc.checked && state.done[k][idx]) unmarkDone(k,idx); const y=window.scrollY; if(play && fc.checked) playRelearn(idx); else reMain(); renderHeader(); window.scrollTo(0,y); return; }
    if(fc.checked){ setForgot(idx,true,"fin"); if(done){ save(); renderHeader(); } else markDone("fin",idx,true); }
    else { setForgot(idx,false,"fin"); unmarkDone("fin",idx); }

  };

  el.querySelector(".item-top").appendChild(marks);
  if(isAgain) fbw.innerHTML='<p class="hint">'+(play?"Запомни слово. Эта карточка вернётся в конец раздела, и ты напишешь слово ещё раз.":"Запомни слово и сними отметку «Je ne sais plus», чтобы написать его ещё раз. Карточка вернётся в конец списка.")+'</p>';
  if(settled) return el;

// поэтому все четыре варианта выглядят похоже и различать их нужно внимательно
function similarVariants(text,toRu){
  const byType={}; shuffle(toRu ? ruVariants(text) : frVariants(text)).forEach(v=>{ (byType[v.type]=byType[v.type]||[]).push(v.text); });
  return byType;

function pickDistractors(idx,d,toRu,want){
  want=want||3;
  const [fr,ru]=d.phrases[idx], col=toRu?1:0, right=d.phrases[idx][col], seen=new Set([normText(right)]);
  const picks=[], take=t=>{ if(!t) return false; const k=normText(t); if(seen.has(k)) return false; seen.add(k); picks.push({i:-1,text:t}); return true; };
  const byType=similarVariants(right,toRu);
  const types=["rule","num","hom","gender","spell","spell2"].filter(t=>byType[t]);
  types.forEach(t=>byType[t].sort((a,b)=>lev(a,right)-lev(b,right)||0.5-Math.random()));
  // по кругу: по одному варианту каждого типа, пока не наберём нужное число
  for(let round=0; picks.length<want && round<12; round++){
    let added=false;
    for(const t of types){ if(picks.length>=want) break; const list=byType[t]; while(list.length){ if(take(list.shift())){ added=true; break; } } }
    if(!added) break;
  }
  // если ошибок не хватило, делаем ошибку в уже сделанном варианте
  for(const base of picks.slice()){
    if(picks.length>=want) break;
    const more=similarVariants(base.text,toRu);
    for(const t of Object.keys(more)){ for(const x of more[t]){ if(picks.length>=want) break; take(x); } }
  }
  if(picks.length<want){
    const g=Math.floor(idx/3)*3, near=d.phrases.map((q,i)=>({text:q[col], i, score:sim(q[0],fr)+sim(q[1],ru)})).filter(c=>c.i!==idx && Math.floor(c.i/3)*3!==g).sort((x,y)=>y.score-x.score).slice(0,8);
    for(const c of shuffle(near)){ if(picks.length>=want) break; take(c.text); }
  }
  return picks;
}

    l.innerHTML='<input type="checkbox" data-'+id+'"'+(checked?" checked":"")+'><span class="sw-track" aria-hidden="true"></span><span class="sw-text">'+label+'</span><span class="sw-gain">'+gainTxt+(checked?' <span class="sw-ck">✓</span>':"")+'</span>';
    const inp=l.querySelector("input"); inp.onchange=()=>onChange(inp); return l;
  };
  for(let n=1;n<=MAXLEVEL;n++){
    const done=levelDone(n), pct=levelPct(n), d=BUILTIN[n], st=n===state.level?state:levelsSaved[n];
    const item=document.createElement("div"); item.className="lv-item"+(n===state.level?" cur":"")+(done?" done":"");
    const b=document.createElement("button"); b.type="button"; b.className="lv-card"; b.dataset.level=n; b.setAttribute("aria-current",n===state.level);
    b.innerHTML='<span class="lvnum">'+(done?"✓":n)+'</span><span class="lvtxt"><b>'+esc(d.fr)+'</b><small>'+esc(d.ru)+'</small><span class="lvbar"><span style="width:'+pct+'%"></span></span></span><span class="lvst">'+(done?"terminé":pct+"%")+'</span><span class="lvgo" aria-hidden="true">'+CHEV()+'</span>';
    b.onclick=()=>goLevel(n);
    const gain=4-levelEarned(st), back=levelEarned(st)+(st&&st.rapEarned?1:0);
    item.appendChild(b);
    item.appendChild(sw('mark="'+n,"J'ai déjà fait ce niveau",(done?levelEarned(st):gain)?"+"+(done?levelEarned(st):gain)+" 🦐":"",done,inp=>{
      if(inp.checked) markLevelDone(n);
      else if(confirm("Réinitialiser le niveau "+n+" ?"+(back?" Les crevettes de ce niveau ("+back+") seront retirées.":""))) unmarkLevelDone(n); else inp.checked=true;
    }));
    host.appendChild(item);
    if(n<MAXLEVEL){
      // между уровнями идёт Rappel: повторение всех пройденных уровней, за него +1 креветка
      const m=n+1, ms=m===state.level?state:levelsSaved[m], rdone=!!(ms&&ms.rapEarned);
      const rap=document.createElement("div"); rap.className="lv-rap"+(rdone?" done":"");
      const rb=document.createElement("button"); rb.type="button"; rb.className="lv-rapcard"; rb.dataset.rappel=m;
      rb.innerHTML='<span class="rapsp" aria-hidden="true"></span><span class="raptxt"><b>Rappel · '+(n===1?'niveau 1':'niveaux 1 à '+n)+'</b><small>Повторение пройденного</small></span><span class="lvgo" aria-hidden="true">'+CHEV()+'</span>';
      rb.onclick=()=>openRappel(m);
      rap.appendChild(rb);
      rap.appendChild(sw('rappel="'+m,"Je connais déjà",rdone?"+1 🦐":"+1 🦐",rdone,inp=>markRappel(m,inp.checked)));
      host.appendChild(rap);
    }
  }
}

/* ---------- одна карточка за раз ---------- */
// ответ на другую карточку не подсмотреть: на экране только одна. Пройденный этап можно листать
let play=null;   // {k, level, mode:"play"|"browse", cur, pos, rel}
let plObs=null;
const reMain=()=>{ if(play) playRerender(); else renderMain(); };
function stopAudio(){ try{ if(rec) rec.stop(); }catch(e){} try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
function seqFor(k){
  if(!isRev(k)) return order(k);
  const src=revSrc(k), inSec=order(src).filter(i=>state.fg[src].indexOf(i)>=0), tail=state.tail[k].filter(i=>inSec.indexOf(i)>=0);
  return [...inSec.filter(i=>tail.indexOf(i)<0), ...tail];
}
const isSettled=(k,i)=>!!state.done[k][i] || (isRev(k) && state.again[k].indexOf(i)>=0);
function cardEl(k,idx,n){
  const d=levelData(state.level), [fr,ru]=d.phrases[idx];
  if(k==="rel") return speechItem(idx,fr,ru,"rel",false,n);
  if(k==="ass"||k==="rev_ass") return assItem(idx,d,k,n);
  if(k==="fin"||k==="rev_fin") return dictItem(idx,fr,ru,k,n);
  return speechItem(idx,fr,ru,k,k!=="rep",n);
}
function stageInfo(k){ return isRev(k) ? REV_SUBS.find(x=>x.key===k) : STAGES.find(s=>s.key===k); }
function firstOpen(k){
  let i=seqFor(k).find(x=>!isSettled(k,x));
  if(i===undefined && isRev(k) && state.again[k].length){   // отложенные снова карточки возвращаются вслепую
    [...state.again[k]].forEach(x=>setAgain(k,x,false));
    i=seqFor(k).find(x=>!isSettled(k,x));
  }
  return i;
}
// ключ задания, которое сейчас на экране (в повторе это выбранный раздел)
function curStageKey(){
  if(state.view===4){ const secs=revSections(); if(!secs.length) return null; const c=secs.find(x=>x.key===state.revKey)||secs[0]; state.revKey=c.key; return c.key; }
  return STAGES[state.view].key;
}
function renderStage(){
  const host=$("stageHost");
  stopAudio(); if(plObs){ plObs.disconnect(); plObs=null; }
  const k=(screen==="level" && !needRecap() && levelData(state.level)) ? curStageKey() : null;
  if(!k){ play=null; host.style.display="none"; $("plHost").innerHTML=""; $("plBottom").innerHTML=""; return; }
  host.style.display="";
  const tot=stageCount(k), complete=tot>0 && doneCount(k)>=tot;
  play={k,level:state.level,mode:complete?"browse":"play",cur:null,pos:0,rel:null};
  renderPlayer();
}
function renderPlayer(){
  const k=play.k, host=$("plHost"), bot=$("plBottom");
  if(plObs){ plObs.disconnect(); plObs=null; }
  host.innerHTML=""; bot.innerHTML=""; $("stageHost").classList.toggle("browse",play.mode==="browse");
  if(play.mode==="browse"){
    const seq=seqFor(k); play.pos=Math.max(0,Math.min(seq.length-1,play.pos));
    host.appendChild(cardEl(k,seq[play.pos],play.pos+1));
    const row=document.createElement("div"); row.className="row";
    row.innerHTML='<button class="btn ghost" id="plPrev"'+(play.pos<=0?" disabled":"")+'>'+CHEV("l")+' Назад</button><button class="btn violet" id="plNext"'+(play.pos>=seq.length-1?" disabled":"")+'>Дальше '+CHEV()+'</button>';
    bot.appendChild(row);
    $("plPrev").onclick=()=>{ stopAudio(); play.pos--; renderPlayer(); };
    $("plNext").onclick=()=>{ stopAudio(); play.pos++; renderPlayer(); };
    renderProgress(); return;
  }
  if(play.rel!=null){ renderRelearnCard(); return; }
  if(play.cur==null) play.cur=firstOpen(k);
  if(play.cur===undefined || play.cur===null){ renderPlayerEnd(); return; }
  const seq=seqFor(k);
  host.appendChild(cardEl(k,play.cur,seq.indexOf(play.cur)+1));
  plObs=new MutationObserver(()=>plSync()); plObs.observe(host,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  plSync();
}
// карточка, ответ на которую уже дан, открывает кнопку «Дальше»
function plSync(){
  renderProgress();
  if(!play || play.mode!=="play" || play.cur==null) return;
  const k=play.k, bot=$("plBottom"), settled=play.rel!=null ? isSettled("rel",play.rel) : isSettled(k,play.cur);
  let go=$("plGo");
  if(!go){   // кнопка есть всегда, поэтому ничего не прыгает. Пока ответа нет, она неактивна
    bot.innerHTML='<div class="row"><button class="btn violet" id="plGo" style="width:100%;font-size:1.15rem">Дальше '+CHEV()+'</button></div>';
    go=$("plGo"); go.onclick=plAdvance;
  }
  go.disabled=!settled;
}
// в повторе «Je ne sais plus» возвращает на первую вкладку: фраза показывается так же, как в «Écoute & répète», потом возвращается в конец раздела
function playRelearn(idx){ state.done.rel[idx]=false; play.rel=idx; save(); renderRelearnCard(); }
function renderRelearnCard(){
  const host=$("plHost"); host.innerHTML="";
  const ban=document.createElement("div"); ban.className="relearn";
  ban.innerHTML="↩ Вернулись на первую вкладку «"+esc(STAGES[0].tab)+"». Послушай эту фразу и повтори её вслух. Потом она вернётся в повтор.";
  host.appendChild(ban);
  host.appendChild(cardEl("rel",play.rel,seqFor(play.k).indexOf(play.rel)+1));
  if(plObs) plObs.disconnect();
  plObs=new MutationObserver(()=>plSync()); plObs.observe(host,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  plSync();
}
function plAdvance(){
  stopAudio(); const bot=$("plBottom"); play.rel=null;
  play.cur=firstOpen(play.k); if(play.cur===undefined) play.cur=null;
  if(play.cur==null){ renderPlayerEnd(); } else renderPlayer();
}
function playRerender(){
  if(!play) return;
  if(play.mode==="play" && play.rel!=null){ renderRelearnCard(); }
  else if(play.mode==="play" && play.cur!=null){ const host=$("plHost"); const seq=seqFor(play.k); host.innerHTML=""; host.appendChild(cardEl(play.k,play.cur,seq.indexOf(play.cur)+1)); plSync(); }
  else renderPlayer();
}
// что предложить после этапа: следующий этап или следующий раздел повтора
function nextStep(k){
  if(isRev(k)){
    const nx=revSections().find(x=>x.key!==k && doneCount(x.key)<stageCount(x.key));
    return nx?{label:"Дальше: "+nx.tab, go:()=>{ state.revKey=nx.key; navTo(); }}:null;
  }
  const i=STAGES.findIndex(s=>s.key===k), to=i+1;
  if(i>=0 && to<STAGES.length && to<=unl()) return {label:"Дальше: "+STAGES[to].tab, go:()=>{ state.view=to; navTo(); }};
  return null;
}
function renderPlayerEnd(){
  const k=play.k, host=$("plHost"), bot=$("plBottom"); host.innerHTML=""; bot.innerHTML="";
  if(plObs){ plObs.disconnect(); plObs=null; }
  renderProgress();
  const w=document.createElement("section"); w.className="panel win";
  w.innerHTML='<div class="big">🐈🎉</div><h2 style="margin:.3em 0">Bravo !</h2><p>'+(isRev(k)?"Раздел «"+esc(stageInfo(k).tab.replace(/^\S+\s/,""))+"» пройден.":"Этап «"+esc(stageInfo(k).tab.replace(/^\S+\s/,""))+"» пройден.")+'</p>';
  host.appendChild(w);
  const row=document.createElement("div"); row.className="row"; row.style.flexDirection="column";
  const nx=nextStep(k);
  if(nx){ const b=document.createElement("button"); b.className="btn cta"; b.style.width="100%"; b.id="plNextStep"; b.textContent=nx.label; b.onclick=nx.go; row.appendChild(b); }
  bot.appendChild(row);
}

// текст и шкала задания на экране: «0 из 18»
function renderProgress(){
  const bar=$("bar"), wrap=$("barWrap");
  const set=(txt,n,t)=>{ $("prog").textContent=txt; bar.style.width=(t?n/t*100:100)+"%"; wrap.setAttribute("aria-valuemax",t); wrap.setAttribute("aria-valuenow",n); };
  if(needRecap()){ const t=stageCount("rec"), n=doneCount("rec"); set("Rappel : "+n+" sur "+t,n,t); return; }
  const k=levelData(state.level)?curStageKey():null;
  if(!k){ set("Rien à revoir",1,1); return; }
  const tot=stageCount(k), dn=doneCount(k), src=isRev(k)?"":k;
  if(play && play.k===k && play.mode==="browse"){ const len=seqFor(k).length; set((play.pos+1)+" sur "+len+" · aperçu",play.pos+1,len); return; }
  set(dn+" sur "+tot+((src==="dis"||src==="ass"||src==="fin")&&state.fg[src].length?" · "+state.fg[src].length+" à revoir":""),dn,tot);
}
// теория уровня вверху, её можно свернуть и развернуть
const theoryOpen={};
function renderTheory(){
  const h=$("theoryHost"); h.innerHTML="";
  if(screen!=="level" || !levelData(state.level)) return;
  if(needRecap()){   // во время Rappel теории нет, остаётся только название уровня
    const pl=planFor(state.level), t=document.createElement("section"); t.className="theory titleonly";

function renderMain(){
  const m=$("main"); m.innerHTML="";
  const d=levelData(state.level), pw=$("progWrap");
  if(needRecap()){ m.before(pw); renderRecap(m); return; }
  m.after(pw);
  if(d) checkWon();
  if(!d){
    const w=document.createElement("section"); w.className="panel win";
    w.innerHTML='<div class="big">🐈🏆</div><h2 style="margin:.3em 0">Félicitations ! Tous les niveaux sont terminés !</h2><p>Поздравляю! Все уровни пройдены. Можно пройти любой уровень заново на главном экране.</p>';
    m.appendChild(w); return;

    m.appendChild(w);

function renderReview(m){
  if(!state.forgot.length){
    const w=document.createElement("section"); w.className="panel win";
    w.innerHTML='<div class="big">🐈✨</div><h2 style="margin:.3em 0">Повторять нечего!</h2><p>Ты не откладывала карточки. Повтор последний этап, поэтому после «Dictée» и «Dis-le» уровень засчитывается сам.</p>';
    m.appendChild(w); return;
  }
  const secs=revSections(), cur=secs.find(x=>x.key===state.revKey)||secs[0]; state.revKey=cur.key;
  const nav=document.createElement("nav"); nav.className="substages"; nav.setAttribute("aria-label","Разделы повторения");
  secs.forEach(x=>{
    const b=document.createElement("button"); b.className="stage";
    const complete=doneCount(x.key)>=stageCount(x.key);
    b.innerHTML=esc(x.tab)+" ("+stageCount(x.key)+")"+(complete?' <span class="ck">✓</span>':"");
    b.setAttribute("aria-pressed",x.key===cur.key);
    b.onclick=()=>{ state.revKey=x.key; save(); renderAll(); };
    nav.appendChild(b);
  });
  m.appendChild(nav);
  const hint=document.createElement("p"); hint.className="hint";
  hint.textContent="Здесь только карточки, которые ты отложила в разделе «"+cur.tab.replace(/^\S+\s/,"")+"» ("+stageCount(cur.key)+"). Если опять не помнишь, вернёмся на первую вкладку.";
  m.appendChild(hint);
}
