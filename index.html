<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Français avec Marcel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9F0FB; --paper:#FFFFFF; --ink:#18275A; --soft:#5B6A94;
  --bleu:#2346A8; --rouge:#E2453C; --line:#CDD8EE;
  --water1:#7FD3E6; --water2:#2E8FB8; --sand:#F1D9A0;
  --ok:#14885A; --okbg:#DDF5E9; --bad:#C8322A; --badbg:#FDE3E1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1838; --paper:#18244D; --ink:#EEF2FF; --soft:#A9B6DD;
    --bleu:#8EA8FF; --rouge:#FF6E66; --line:#2C3B6E;
    --water1:#2B7F9C; --water2:#123E63; --sand:#8C7746;
    --ok:#4FD39A; --okbg:#173D33; --bad:#FF8A82; --badbg:#4A1E2A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1838; --paper:#18244D; --ink:#EEF2FF; --soft:#A9B6DD;
  --bleu:#8EA8FF; --rouge:#FF6E66; --line:#2C3B6E;
  --water1:#2B7F9C; --water2:#123E63; --sand:#8C7746;
  --ok:#4FD39A; --okbg:#173D33; --bad:#FF8A82; --badbg:#4A1E2A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 60px;display:grid;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.45rem,5vw,2.1rem);font-weight:700;letter-spacing:-.01em}
h1 .flag{display:inline-block;width:.55em;height:1.1em;vertical-align:-.15em;margin-right:.35em;border-radius:4px;
  background:linear-gradient(90deg,#2346A8 0 33%,#fff 33% 66%,#E2453C 66%);box-shadow:0 0 0 2px var(--line)}
.pill{font-size:1.1rem;font-weight:600;background:var(--paper);border:2px solid var(--line);padding:6px 14px;border-radius:999px;white-space:nowrap}

.marcel{display:flex;gap:12px;align-items:flex-end}
.cat{font-size:62px;line-height:1;flex:none;transform-origin:bottom center}
.cat.happy{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bubble{background:var(--paper);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:12px 16px;flex:1}
.bubble .fr{font-weight:600;font-size:1.15rem}
.bubble .ru{color:var(--soft)}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px}
.level-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.level-num{font-size:1.3rem;font-weight:700}
.construction{color:var(--soft)}
.bar{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden;margin:10px 0 6px}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bleu),var(--rouge));transition:width .4s}
.prog{font-weight:600}

.stages{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;background:var(--bg)}
.stage{flex:none;font:inherit;font-size:.95rem;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.stage[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stage:disabled{opacity:.5;cursor:not-allowed}
.stage .ck{color:var(--ok)}

.list{display:grid;gap:10px}
.item{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px}
.item.done{border-color:var(--ok);background:var(--okbg)}
.item.wrong{border-color:var(--bad)}
.item-top{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-content:center;font-weight:600;font-size:.9rem;background:var(--bg);border:2px solid var(--line)}
.item.done .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.texts{flex:1;min-width:0}
.fr{font-size:1.25rem;font-weight:600;color:var(--bleu)}
.ru{color:var(--soft)}
.ru.big{font-size:1.2rem;color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:1rem;border:none;border-radius:14px;padding:10px 14px;cursor:pointer;color:#fff;background:var(--bleu);min-height:46px}
.btn.red{background:var(--rouge)}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--rouge) 30%,transparent)}}
.btn:focus-visible,.stage:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 11px;flex:1;min-width:0}
.typerow{display:flex;gap:8px}
.known{display:inline-flex;align-items:center;gap:6px;flex:none;margin-left:auto;min-height:40px;padding:0 10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-weight:600;font-size:.9rem;line-height:1.1;cursor:pointer}
.known input{width:20px;height:20px;margin:0;accent-color:var(--ok);cursor:pointer}
.item.done .known{border-color:var(--ok);background:var(--paper)}
.known:focus-within{outline:3px solid var(--rouge);outline-offset:2px}

.fb{border-radius:12px;padding:8px 12px;font-size:.98rem}
.fb.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.fb.bad{background:var(--badbg)}
.fb .said{margin:2px 0}
.w-ok{color:var(--ok);font-weight:600}
.w-bad{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.w-extra{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.tip{margin-top:6px;color:var(--ink)}
.fb .said{font-size:1.12rem;margin:2px 0 4px}
.fb .lbl{font-size:.9rem;color:var(--soft);font-weight:400}
.fb.ok .said{color:var(--ink);font-weight:400}
.fb.live{background:var(--bg);font-size:1.1rem}
.fb .note{font-size:.9rem;color:var(--soft);font-weight:400;margin-top:2px}
.w-near{color:#C77700;font-weight:600;text-decoration:underline dotted}
.w-dim{color:var(--soft)}
.tip::before{content:"🐈 "}

.opts{display:grid;gap:6px}
.opt{font:inherit;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through}
.q{font-size:1.15rem;font-weight:600}

.speed{display:flex;align-items:center;gap:8px;color:var(--soft);font-size:.95rem}
.speed input{flex:1}
.notice{background:var(--badbg);border-radius:14px;padding:10px 14px}

.aqua{position:relative;height:160px;border-radius:24px 24px 18px 18px;overflow:hidden;border:3px solid var(--ink);
  background:linear-gradient(180deg,var(--water1),var(--water2))}
.aqua::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:var(--sand)}
.weed{position:absolute;bottom:16px;font-size:32px;z-index:1}
.shrimp{position:absolute;font-size:28px;z-index:2;animation:swim var(--d,7s) ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(0) scaleX(1)}to{transform:translateX(var(--dx,60px)) scaleX(-1)}}
.bub{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.7);bottom:28px;animation:rise 4s linear infinite}
@keyframes rise{to{transform:translateY(-140px);opacity:0}}
.aqua-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#fff;font-weight:500;z-index:3;padding:0 20px 20px}
.win{text-align:center;padding:24px 16px}
.win .big{font-size:3rem}
details summary{cursor:pointer;color:var(--soft);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:480px){.cat{font-size:50px}.fr{font-size:1.12rem}}
@media (max-width:600px){
  .item.sp .item-top{flex-wrap:wrap;align-items:center}
  .item.sp .item-top .num{order:1}
  .item.sp .item-top .known{order:2}
  .item.sp .item-top .texts{order:3;flex:1 1 100%}
  .item.sp .actions{flex-direction:column;align-items:stretch}
  .item .actions .btn{flex:none;width:100%;min-height:54px;font-size:1.05rem}
  .item .actions .typerow{flex:none!important;width:100%}
  .item .actions .typerow .btn{flex:none;width:auto;min-width:64px}
  .item .actions .typerow input{min-height:54px;font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="flag" aria-hidden="true"></span>Français avec Marcel</h1>
    <div class="pill" id="shrimpTop">🦐 Crevettes : 0</div>
  </header>

  <section class="marcel" aria-live="polite">
    <div class="cat" id="cat" aria-hidden="true">🐈</div>
    <div class="bubble"><div class="fr" id="sayFr"></div><div class="ru" id="sayRu"></div></div>
  </section>

  <section class="panel">
    <div class="level-row">
      <div class="level-num" id="levelNum"></div>
      <div class="construction" id="construction"></div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" id="barWrap"><span id="bar"></span></div>
    <div class="prog" id="prog"></div>
    <div class="speed" style="margin-top:8px"><span>🐢</span><input type="range" id="rate" min="0.5" max="1.1" step="0.1" value="0.8" aria-label="Скорость озвучки"><span>🐇</span></div>
  </section>

  <div id="micNotice"></div>

  <nav class="stages" id="stages" aria-label="Этапы"></nav>

  <main id="main"></main>

  <section class="panel" aria-label="Аквариум">
    <div class="aqua" id="aqua"></div>
    <details style="margin-top:10px">
      <summary>⚙️ Настройки</summary>
      <div class="actions" style="margin-top:10px">
        <button class="btn ghost" id="restartLevel">Начать уровень заново</button>
        <label style="display:flex;gap:6px;align-items:center">Уровень <select id="levelPick" style="font:inherit;padding:6px;border-radius:10px"></select></label>
        <button class="btn ghost" id="resetAll">Сбросить весь прогресс</button>
      </div>
    </details>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- DATA ---------- */
const BUILTIN = {"1": {fr: "Je veux + nombre + nom", ru: "Я хочу + количество + предмет", phrases: [["Je veux une pomme.", "Я хочу одно яблоко."], ["Je veux deux poires.", "Я хочу две груши."], ["Je veux trois bananes.", "Я хочу три банана."], ["Je veux quatre carottes.", "Я хочу четыре морковки."], ["Je veux cinq oranges.", "Я хочу пять апельсинов."], ["Je veux six œufs.", "Я хочу шесть яиц."], ["Je veux sept fraises.", "Я хочу семь клубник."], ["Je veux huit croissants.", "Я хочу восемь круассанов."], ["Je veux neuf citrons.", "Я хочу девять лимонов."], ["Je veux dix yaourts.", "Я хочу десять йогуртов."], ["Je veux onze cerises.", "Я хочу одиннадцать вишен."], ["Je veux douze huîtres.", "Я хочу двенадцать устриц."], ["Je veux treize abricots.", "Я хочу тринадцать абрикосов."], ["Je veux quatorze champignons.", "Я хочу четырнадцать грибов."], ["Je veux quinze pêches.", "Я хочу пятнадцать персиков."], ["Je veux dix-sept oignons.", "Я хочу семнадцать луковиц."], ["Je veux dix-huit kiwis.", "Я хочу восемнадцать киви."], ["Je veux dix-neuf radis.", "Я хочу девятнадцать редисок."], ["Je veux vingt sardines.", "Я хочу двадцать сардин."], ["Je veux vingt et un sandwichs.", "Я хочу двадцать один сэндвич."], ["Je veux vingt-deux poivrons.", "Я хочу двадцать два перца."], ["Je veux vingt-cinq tomates.", "Я хочу двадцать пять помидоров."], ["Je veux trente saucisses.", "Я хочу тридцать сосисок."], ["Je veux trente-six bonbons.", "Я хочу тридцать шесть конфет."], ["Je veux quarante-deux courgettes.", "Я хочу сорок два кабачка."], ["Je veux cinquante-sept concombres.", "Я хочу пятьдесят семь огурцов."], ["Je veux soixante et onze baguettes.", "Я хочу семьдесят один багет."], ["Je veux quatre-vingt-trois bouteilles de lait.", "Я хочу восемьдесят три бутылки молока."], ["Je veux quatre-vingt-dix-huit fromages.", "Я хочу девяносто восемь сыров."], ["Je veux cent pains au chocolat.", "Я хочу сто булочек с шоколадом."]], final: [["Je veux trois ananas.", "Я хочу три ананаса."], ["Je   {key:"dis", tab:"🇷🇺 Dis-le", fr:"Dis-le en français.", ru:"Скажи это по-французски."},
  {key:"fin", tab:"🏁 Test final", fr:"Le test final !", ru:"Финальная проверка: новые фразы."}
];

/* ---------- STATE ---------- */
const KEY="marcel-course-v3";
const fresh = () => ({level:1, shrimps:0, unlocked:0, view:0, done:{rep:[],ass:[],dis:[],fin:[]}, won:false});
let state = fresh(), generated = {};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s){ state={...fresh(),...s.state}; generated=s.generated||{}; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({state, generated})); }catch(e){} }
function levelData(n){ return BUILTIN[n] || generated[n] || null; }
function planFor(n){ return BUILTIN[n] || PLAN[n] || {fr:"Конструкция "+n, ru:"", theme:"повседневные ситуации"}; }

const $=id=>document.getElementById(id);
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2000);}
function happy(){const c=$("cat");c.classList.remove("happy");void c.offsetWidth;c.classList.add("happy");}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- CHECKING ---------- */
const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const TENS={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
// digits from speech recognition -> French words; a final "1" becomes "§1" (= un OR une)
function numFr(n){
  if(n<20) return n===1?"§1":U[n];
  if(n===100) return "cent";
  if(n>100) return String(n);
  const t=Math.floor(n/10), u=n%10;
  if(t<=6) return TENS[t]+(u===0?"":u===1?" et §1":"-"+U[u]);
  if(t===7) return "soixante"+(u===1?" et onze":"-"+U[10+u]);
  if(t===8) return u===0?"quatre-vingts":"quatre-vingt-"+(u===1?"§1":U[u]);
  return "quatre-vingt-"+U[10+u];
}
const FILLERS=new Set(["euh","heu","bah","ben","hum","mmm"]);
function tokens(s){
  return s.toLowerCase().replace(/\d+/g,d=>" "+numFr(+d)+" ").replace(/[’`´]/g,"'").replace(/œ/g,"oe").replace(/æ/g,"ae")
    .replace(/[.,!?;:«»"()…]/g," ").replace(/-/g," ").replace(/'/g,"")
    .split(/\s+/).filter(w=>w && !FILLERS.has(w));
}
function deaccent(w){return w.normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function sound(w){ w=deaccent(w); return w.length>3 ? w.replace(/(ent|es|s|x|t|e)$/,"") : w.replace(/[sxt]$/,""); }
// "exact" | "near" (sounds the same) | "accent" (typed, accents differ) | false
function eq(t, s, mode){
  if(t===s) return "exact";
  if(s==="§1" && (t==="un"||t==="une")) return "exact";
  if(deaccent(t)===deaccent(s)) return mode==="speech" ? "near" : "accent";
  if(mode==="speech" && sound(t)===sound(s)) return "near";
  return false;
}
function check(target, said, mode){
  const T=tokens(target);
  const saidWords=said.trim().split(/\s+/), owner=[], S=[];
  saidWords.forEach((w,wi)=>tokens(w).forEach(tk=>{S.push(tk);owner.push(wi);}));
  const n=T.length, m=S.length, L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) L[i][j]= eq(T[i],S[j],mode) ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const tOk=Array(n).fill(false), sType=Array(m).fill(false);
  let i=0,j=0; while(i<n&&j<m){ const e=eq(T[i],S[j],mode); if(e){ tOk[i]=true; sType[j]=e; i++;j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  const ok = tOk.every(Boolean) && sType.every(Boolean);
  const near = sType.some(x=>x==="near"), accent = sType.some(x=>x==="accent");
  // target words
  const shown=target.replace(/-/g," ").split(/\s+/);
  let k=0; const tHtml=shown.map(w=>{ const parts=tokens(w); if(!parts.length) return esc(w); let good=true; parts.forEach(()=>{ if(!tOk[k++]) good=false; }); return '<span class="'+(good?"w-ok":"w-bad")+'">'+esc(w)+'</span>'; }).join(" ");
  // what she actually said, word by word
  const sHtml=saidWords.map((w,wi)=>{
    const types=sType.filter((_,x)=>owner[x]===wi);
    if(!types.length) return '<span class="w-dim">'+esc(w)+'</span>';
    const cls = types.includes(false) ? "w-extra" : types.some(t=>t==="near"||t==="accent") ? "w-near" : "w-ok";
    return '<span class="'+cls+'">'+esc(w)+'</span>';
  }).join(" ");
  return {ok, near, accent, tHtml, sHtml};
}

/* ---------- MARCEL TIP (sample) ---------- */
let samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(()=>null) : Promise.resolve(null);
let sampleOff=false;
async function marcelTip(el, target, said, ru){
  if(sampleOff) return;
  const sample = await samplePromise; if(!sample){ return; }
  el.textContent="Марсель думает…";
  const prompt = `Ты Марсель — дружелюбный французский кот, преподаватель французского для начинающей ученицы, объясняешь по-русски.
Ученица должна была сказать: "${target}" (${ru}).
Браузерное распознавание речи услышало: "${said}".
Коротко (1–2 предложения, по-русски) объясни, что, скорее всего, не так с произношением или словами и как это исправить (подскажи звук, артикуляцию или русскую подсказку для звучания). Не хвали, не повторяй задание целиком, без вступлений. Распознавание может ошибаться — не утверждай, что слышишь звук.`;
  try{ const r = await sample(prompt,{modelTier:"quick"}); el.textContent=r.text.trim(); }
  catch(e){ el.textContent=""; if(e && (e.code==="not_granted")) sampleOff=true; }
}

/* ---------- SPEECH ---------- */
let frVoice=null;
function pickVoice(){const v=speechSynthesis.getVoices();frVoice=v.find(x=>x.lang==="fr-FR")||v.find(x=>x.lang&&x.lang.startsWith("fr"))||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){
  if(!("speechSynthesis" in window)){toast("Озвучка не поддерживается этим браузером");return;}
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="fr-FR"; if(frVoice)u.voice=frVoice; u.rate=+$("rate").value; speechSynthesis.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBroken=!SR, rec=null, recBtn=null;
function listen(btn, onText, onLive){
  if(rec){ try{rec.stop();}catch(e){} if(recBtn===btn) return; }
  const me=new SR(); rec=me; recBtn=btn;
  me.lang="fr-FR"; me.interimResults=true; me.continuous=true; me.maxAlternatives=1;
  let got="", heard="", timer=null;
  // не обрываем на первой паузе: останавливаемся, когда тишина длится дольше
  const arm=ms=>{ clearTimeout(timer); timer=setTimeout(()=>{ try{me.stop();}catch(e){} }, ms); };
  me.onstart=()=>{btn.classList.add("listening");btn.textContent="⏹ Стоп"; if(onLive) onLive("…"); arm(8000);};
  me.onresult=e=>{
    const fin=[], tmp=[];
    for(const r of e.results){ (r.isFinal?fin:tmp).push(r[0].transcript.trim()); }
    got=fin.join(" ").trim(); heard=fin.concat(tmp).join(" ").trim();
    if(onLive) onLive(heard||"…");
    arm(2000);
  };
  me.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){ micBroken=true; renderNotice(); renderMain(); }
    else if(e.error==="no-speech") toast("Ничего не услышала. Говори чуть громче 🎤");
  };
  me.onend=()=>{ clearTimeout(timer); btn.classList.remove("listening"); btn.textContent="🎤 Parler";
    if(rec===me){ rec=null; recBtn=null; }
    const text=(got||heard).trim();
    if(text) onText(text); else if(onLive) onLive("ничего не распознано, попробуй ещё раз"); };
  try{ me.start(); }catch(e){ micBroken=true; renderNotice(); renderMain(); }
}
function renderNotice(){
  $("micNotice").innerHTML = micBroken ? '<div class="notice">🎤 Микрофон недоступен в этом браузере или окне. Лучше всего открыть страницу в Chrome или Edge и разрешить микрофон. Пока можно вводить ответы текстом ✍️.</div>' : "";
}

/* ---------- RENDER ---------- */
function stageCount(k){ const d=levelData(state.level); return k==="fin" ? (d?d.final.length:5) : (d?d.phrases.length:30); }
function doneCount(k){ return state.done[k].filter(Boolean).length; }

function renderHeader(){
  const p=planFor(state.level);
  $("levelNum").textContent="Niveau "+state.level;
  $("construction").textContent=p.fr+" — "+p.ru;
  const k=STAGES[state.view].key, tot=stageCount(k), dn=doneCount(k);
  $("prog").textContent=STAGES[state.view].tab+": "+dn+" / "+tot;
  $("bar").style.width=(dn/tot*100)+"%"; $("barWrap").setAttribute("aria-valuemax",tot); $("barWrap").setAttribute("aria-valuenow",dn);
  $("shrimpTop").textContent="🦐 Crevettes : "+state.shrimps;
  const st=STAGES[state.view]; $("sayFr").textContent=st.fr; $("sayRu").textContent=st.ru;
  const nav=$("stages"); nav.innerHTML="";
  STAGES.forEach((s,i)=>{
    const b=document.createElement("button"); b.className="stage";
    const complete = doneCount(s.key)>=stageCount(s.key);
    b.innerHTML=(i>state.unlocked?"🔒 ":"")+esc(s.tab)+(complete?' <span class="ck">✓</span>':"");
    b.disabled=i>state.unlocked; b.setAttribute("aria-pressed",i===state.view);
    b.onclick=()=>{state.view=i;save();renderAll();window.scrollTo({top:0,behavior:"smooth"});};
    nav.appendChild(b);
  });
}

function markDone(k, idx){
  state.done[k][idx]=true; happy();
  const tot=stageCount(k);
  if(doneCount(k)>=tot){
    const si=STAGES.findIndex(s=>s.key===k);
    if(k==="fin"){ if(!state.won) state.shrimps++; state.won=true; toast("Bravo ! Tu gagnes une crevette ! 🦐"); }
    else if(si+1>state.unlocked){ state.unlocked=si+1; toast("Bravo ! Этап открыт: "+STAGES[si+1].tab); }
  }
  save(); renderHeader(); renderAqua();
  if(doneCount(k)>=tot) renderMain();
}

function unmarkDone(k, idx){
  const wasComplete=doneCount(k)>=stageCount(k);
  state.done[k][idx]=false; save(); renderHeader();
  if(wasComplete){ const y=window.scrollY; renderMain(); window.scrollTo(0,y); }
}

function feedbackHtml(res, said, target, showAnswer, mode){
  const verb = mode==="typed" ? "Ты написала" : "Ты сказала";
  const heard='<div class="said"><span class="lbl">'+verb+':</span> '+res.sHtml+'</div>';
  if(res.ok) return '<div class="fb ok">'+heard+'<div>'+(res.accent?"Presque parfait ! ✅ Проверь акценты: "+esc(target):"Très bien ! ✅🐾")+'</div>'+
    (res.near?'<div class="note">Оранжевые слова записаны иначе, но звучат так же. Произношение засчитано.</div>':"")+'</div>';
  return '<div class="fb bad">'+heard+
    '<div class="said"><span class="lbl">'+(showAnswer?"Правильно":"Нужно")+':</span> '+res.tHtml+'</div>'+
    '<div><b>Presque !</b> Encore une fois. Ещё раз.</div><div class="tip" hidden></div></div>';
}

function speechItem(idx, fr, ru, k, ruOnly){
  const el=document.createElement("article"); el.className="item sp"+(state.done[k][idx]?" done":"");
  const showFr = !ruOnly || state.done[k][idx];
  el.innerHTML='<div class="item-top"><div class="num">'+(state.done[k][idx]?"✓":idx+1)+'</div><div class="texts">'+
    (showFr?'<div class="fr" lang="fr">'+esc(fr)+'</div>':"")+'<div class="ru'+(ruOnly?" big":"")+'">'+esc(ru)+'</div></div></div>'+
    '<div class="actions"></div><div class="fbwrap"></div>';
  const actions=el.querySelector(".actions"), fbw=el.querySelector(".fbwrap");
  if(!ruOnly || state.done[k][idx]){
    const lb=document.createElement("button"); lb.className="btn"; lb.textContent="🔊 Écouter"; lb.onclick=()=>speak(fr); actions.appendChild(lb);
  }
  const known=document.createElement("label"); known.className="known";
  known.innerHTML='<input type="checkbox"> Я это знаю';
  const cb=known.querySelector("input"); cb.checked=!!state.done[k][idx];
  cb.onchange=()=>{
    if(cb.checked) markDone(k, idx); else unmarkDone(k, idx);
    if(el.isConnected){ const fresh=speechItem(idx, fr, ru, k, ruOnly); el.replaceWith(fresh); const c=fresh.querySelector(".known input"); if(c) c.focus({preventScroll:true}); }
  };
  el.querySelector(".item-top").appendChild(known);
  if(state.done[k][idx]){ return el; }
  const handle=(said, mode)=>{
    const res=check(fr, said, mode);
    fbw.innerHTML=feedbackHtml(res, said, fr, ruOnly, mode);
    if(res.ok){ el.classList.remove("wrong"); markDone(k, idx); el.classList.add("done"); el.querySelector(".num").textContent="✓";
      if(ruOnly){ const t=el.querySelector(".texts"); if(!t.querySelector(".fr")) t.insertAdjacentHTML("afterbegin",'<div class="fr" lang="fr">'+esc(fr)+'</div>'); }
      actions.querySelectorAll(".mic,.typerow").forEach(x=>x.remove()); cb.checked=true;
    } else {
      el.classList.add("wrong");
      const tip=fbw.querySelector(".tip"); if(tip && mode==="speech"){ tip.hidden=false; marcelTip(tip, fr, said, ru); }
      if(ruOnly && !actions.querySelector(".btn:not(.mic):not(.red)")){ const lb=document.createElement("button"); lb.className="btn"; lb.textContent="🔊 Écouter"; lb.onclick=()=>speak(fr); actions.prepend(lb); }
    }
  };
  if(!micBroken){
    const mb=document.createElement("button"); mb.className="btn red mic"; mb.textContent="🎤 Parler";
    mb.onclick=()=>listen(mb, said=>handle(said,"speech"), live=>{ fbw.innerHTML='<div class="fb live"><span class="lbl">Слышу:</span> '+esc(live)+'</div>'; }); actions.appendChild(mb);
  }
  if(micBroken || ruOnly){
    const row=document.createElement("div"); row.className="typerow"; row.style.flex="1 1 220px";
    row.innerHTML='<input type="text" lang="fr" placeholder="✍️ Напиши по-французски" aria-label="Ответ по-французски"><button class="btn ghost">OK</button>';
    const inp=row.querySelector("input"); const go=()=>{ if(inp.value.trim()) handle(inp.value.trim(), micBroken&&!ruOnly?"speech":"typed"); };
    row.querySelector("button").onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go();};
    actions.appendChild(row);
  }
  return el;
}

function rng(seed){ return ()=>{ seed=(seed*9301+49297)%233280; return seed/233280; }; }
function assItem(idx, d){
  const k="ass", [fr,ru]=d.phrases[idx], toRu = idx%2===0;
  const r=rng(state.level*1000+idx*7+3);
  const others=d.phrases.map((p,i)=>i).filter(i=>i!==idx);
  const picks=[]; while(picks.length<2){ const c=others[Math.floor(r()*others.length)]; if(!picks.includes(c) && d.phrases[c][toRu?1:0]!==(toRu?ru:fr)) picks.push(c); }
  const opts=[idx,...picks].map(i=>({i, text:d.phrases[i][toRu?1:0]})).sort(()=>r()-0.5);
  const el=document.createElement("article"); el.className="item"+(state.done[k][idx]?" done":"");
  el.innerHTML='<div class="item-top"><div class="num">'+(state.done[k][idx]?"✓":idx+1)+'</div><div class="texts"><div class="q"'+(toRu?' lang="fr"':"")+'>'+esc(toRu?fr:ru)+'</div></div></div><div class="opts"></div><div class="fbwrap"></div>';
  if(toRu){ const lb=document.createElement("button"); lb.className="btn ghost"; lb.textContent="🔊"; lb.setAttribute("aria-label","Послушать"); lb.style.minHeight="38px"; lb.onclick=()=>speak(fr); el.querySelector(".item-top").appendChild(lb); }
  const box=el.querySelector(".opts");
  opts.forEach((o,n)=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=String.fromCharCode(65+n)+". "+o.text;
    if(state.done[k][idx]){ b.disabled=true; if(o.i===idx) b.classList.add("right"); }
    b.onclick=()=>{
      if(o.i===idx){ b.classList.add("right"); box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        el.querySelector(".fbwrap").innerHTML='<div class="fb ok">Très bien ! ✅</div>'; el.classList.add("done"); el.querySelector(".num").textContent="✓"; markDone(k, idx); }
      else { b.classList.add("no"); b.disabled=true; el.querySelector(".fbwrap").innerHTML='<div class="fb bad"><b>Presque !</b> Попробуй ещё раз.</div>'; }
    };
    box.appendChild(b);
  });
  return el;
}

async function generateLevel(btn, out){
  const sample=await samplePromise;
  if(!sample){ out.textContent="Генерация недоступна в этом окне. Попроси Марселя в чате добавить фразы для этого уровня."; return; }
  const p=planFor(state.level);
  btn.disabled=true; out.textContent="Марсель готовит фразы… это может занять до минуты 🐈";
  const prompt=`Составь материалы для урока разговорного французского (уровень начинающий, ученица говорит по-русски).
Конструкция уровня: "${p.fr}" (${p.ru}). Темы: ${p.theme}.
Нужно ровно 30 коротких фраз, где КАЖДАЯ использует только эту конструкцию (меняются слова и числа), и ещё 5 НОВЫХ фраз с той же конструкцией для финальной проверки (не повторяющих первые 30).
Фразы — естественный современный разговорный французский, 3–7 слов, реальная бытовая лексика. Если в конструкции есть количество, используй числа от 1 до 100 (сначала маленькие, потом больше), всегда словами, а не цифрами. Перевод — естественный русский. Все русские переводы должны быть разными.
Ответь ТОЛЬКО JSON без пояснений: {"phrases":[["фраза fr","перевод ru"], ... 30 штук],"final":[["fr","ru"], ... 5 штук]}`;
  try{
    const data=await sample.json(prompt,{modelTier:"default"});
    if(!data || !Array.isArray(data.phrases) || data.phrases.length<30 || !Array.isArray(data.final) || data.final.length<5) throw {code:"bad"};
    generated[state.level]={fr:p.fr, ru:p.ru, phrases:data.phrases.slice(0,30), final:data.final.slice(0,5)};
    save(); renderAll();
  }catch(e){
    btn.disabled=false;
    out.textContent = e && e.code==="not_granted" ? "Без разрешения Марсель не может подготовить фразы." :
      e && e.code==="rate_limited" ? "Слишком много запросов. Подожди минуту и попробуй снова." : "Не получилось подготовить фразы. Попробуй ещё раз.";
  }
}

function renderMain(){
  const m=$("main"); m.innerHTML="";
  const d=levelData(state.level);
  if(state.won){
    const w=document.createElement("section"); w.className="panel win";
    w.innerHTML='<div class="big">🐈🎉🦐</div><h2 style="margin:.3em 0">Bravo ! Niveau terminé !</h2><p>Браво! Уровень завершён!<br><b>Tu gagnes une crevette !</b> Ты получаешь креветку!</p><p class="pill" style="display:inline-block">🦐 Crevettes : '+state.shrimps+'</p><div style="margin-top:14px"><button class="btn" id="nextLevel">Niveau suivant → Следующий уровень</button></div>';
    m.appendChild(w);
    w.querySelector("#nextLevel").onclick=()=>{ const sh=state.shrimps; state={...fresh(), level:state.level+1, shrimps:sh}; save(); renderAll(); window.scrollTo({top:0}); };
    return;
  }
  if(!d){
    const w=document.createElement("section"); w.className="panel win";
    w.innerHTML='<div class="big">🐈🏆</div><h2 style="margin:.3em 0">Félicitations ! Tous les niveaux sont terminés !</h2><p>Поздравляю! Все уровни пройдены. Можно пройти любой уровень заново в настройках.</p>';
    m.appendChild(w); return;
  }
  const k=STAGES[state.view].key, list=document.createElement("div"); list.className="list";
  if(k==="rep") d.phrases.forEach((p,i)=>list.appendChild(speechItem(i,p[0],p[1],"rep",false)));
  if(k==="ass") d.phrases.forEach((p,i)=>list.appendChild(assItem(i,d)));
  if(k==="dis") d.phrases.forEach((p,i)=>list.appendChild(speechItem(i,p[0],p[1],"dis",true)));
  if(k==="fin") d.final.forEach((p,i)=>list.appendChild(speechItem(i,p[0],p[1],"fin",true)));
  m.appendChild(list);
  const tot=stageCount(k);
  if(doneCount(k)>=tot && state.view<3){
    const nx=document.createElement("div"); nx.style.marginTop="14px";
    nx.innerHTML='<button class="btn" style="width:100%;font-size:1.15rem">Этап пройден! Дальше: '+esc(STAGES[state.view+1].tab)+'</button>';
    nx.querySelector("button").onclick=()=>{state.view++;save();renderAll();window.scrollTo({top:0,behavior:"smooth"});};
    m.appendChild(nx);
  }
}

function renderAqua(){
  const a=$("aqua"); a.innerHTML="";
  [["8%","🌿"],["78%","🪸"],["90%","🌿"]].forEach(([l,e])=>{const w=document.createElement("div");w.className="weed";w.style.left=l;w.textContent=e;a.appendChild(w);});
  for(let i=0;i<3;i++){const b=document.createElement("div");b.className="bub";b.style.left=(20+i*25)+"%";b.style.animationDelay=(i*1.3)+"s";a.appendChild(b);}
  if(!state.shrimps){const e=document.createElement("div");e.className="aqua-empty";e.textContent="Пока пусто. Пройди уровень и получи первую креветку!";a.appendChild(e);return;}
  for(let i=0;i<Math.min(state.shrimps,24);i++){
    const s=document.createElement("div");s.className="shrimp";s.textContent="🦐";
    s.style.left=(5+(i*37)%70)+"%";s.style.top=(12+(i*23)%55)+"%";
    s.style.setProperty("--d",(5+(i%4))+"s");s.style.setProperty("--dx",(40+(i*13)%60)+"px");s.style.animationDelay=(-i*1.1)+"s";a.appendChild(s);
  }
}
function renderAll(){ renderHeader(); renderNotice(); renderMain(); renderAqua(); }

$("restartLevel").onclick=()=>{ if(confirm("Начать текущий уровень заново?")){ const sh=state.shrimps, lv=state.level; state={...fresh(), level:lv, shrimps:sh}; save(); renderAll(); } };
$("resetAll").onclick=()=>{ if(confirm("Сбросить весь прогресс и креветки?")){ state=fresh(); generated={}; save(); renderAll(); } };
const pick=$("levelPick");
for(let n=1;n<=MAXLEVEL;n++){ const o=document.createElement("option"); o.value=n; o.textContent=n+". "+BUILTIN[n].fr; pick.appendChild(o); }
pick.value=Math.min(state.level,MAXLEVEL);
pick.onchange=()=>{ const n=+pick.value; if(n!==state.level && confirm("Перейти на уровень "+n+"? Прогресс текущего уровня начнётся заново.")){ const sh=state.shrimps; state={...fresh(), level:n, shrimps:sh}; save(); renderAll(); } else pick.value=Math.min(state.level,MAXLEVEL); };
renderAll();
</script>
</body>
</html>
