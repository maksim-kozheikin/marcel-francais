<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Français avec Marcel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9F0FB; --paper:#FFFFFF; --ink:#18275A; --soft:#5B6A94;
  --bleu:#2346A8; --rouge:#E2453C; --line:#CDD8EE;
  --water1:#7FD3E6; --water2:#2E8FB8; --sand:#F1D9A0;
  --ok:#14885A; --okbg:#DDF5E9; --bad:#C8322A; --badbg:#FDE3E1;
  --warn:#C77700; --warnbg:#FFF1DA; --violet:#6A38C2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1838; --paper:#18244D; --ink:#EEF2FF; --soft:#A9B6DD;
    --bleu:#8EA8FF; --rouge:#FF6E66; --line:#2C3B6E;
    --water1:#2B7F9C; --water2:#123E63; --sand:#8C7746;
    --ok:#4FD39A; --okbg:#173D33; --bad:#FF8A82; --badbg:#4A1E2A;
    --warn:#F0A63A; --warnbg:#4A3A1E; --violet:#8B67E6;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1838; --paper:#18244D; --ink:#EEF2FF; --soft:#A9B6DD;
  --bleu:#8EA8FF; --rouge:#FF6E66; --line:#2C3B6E;
  --water1:#2B7F9C; --water2:#123E63; --sand:#8C7746;
  --ok:#4FD39A; --okbg:#173D33; --bad:#FF8A82; --badbg:#4A1E2A;
  --warn:#F0A63A; --warnbg:#4A3A1E; --violet:#8B67E6;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 60px;display:grid;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.45rem,5vw,2.1rem);font-weight:700;letter-spacing:-.01em}
h1 .flag{display:inline-block;width:.55em;height:1.1em;vertical-align:-.15em;margin-right:.35em;border-radius:4px;
  background:linear-gradient(90deg,#2346A8 0 33%,#fff 33% 66%,#E2453C 66%);box-shadow:0 0 0 2px var(--line)}
.pill{font-size:1.1rem;font-weight:600;background:var(--paper);border:2px solid var(--line);padding:6px 14px;border-radius:999px;white-space:nowrap}

.marcel{display:flex;gap:12px;align-items:flex-end}
.cat{font-size:62px;line-height:1;flex:none;transform-origin:bottom center}
.cat.happy{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bubble{background:var(--paper);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:12px 16px;flex:1}
.bubble .fr{font-weight:600;font-size:1.15rem}
.bubble .ru{color:var(--soft)}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px}
.level-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.level-num{font-size:1.3rem;font-weight:700}
.construction{color:var(--soft)}
.bar{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden;margin:10px 0 6px}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bleu),var(--rouge));transition:width .4s}
.prog{font-weight:600}

.stages{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;background:var(--bg)}
.stage{flex:none;font:inherit;font-size:.95rem;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.stage[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stage:disabled{opacity:.5;cursor:not-allowed}
.stage .ck{color:var(--ok)}

.list{display:grid;gap:10px}
.item{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px}
.item.done{border-color:var(--ok);background:var(--okbg)}
.item.wrong{border-color:var(--bad)}
.item-top{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-content:center;font-weight:600;font-size:.9rem;background:var(--bg);border:2px solid var(--line)}
.item.done .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.texts{flex:1;min-width:0}
.fr{font-size:1.25rem;font-weight:600;color:var(--bleu)}
.ru{color:var(--soft)}
.ru.big{font-size:1.2rem;color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:1rem;border:none;border-radius:14px;padding:10px 14px;cursor:pointer;color:#fff;background:var(--bleu);min-height:46px}
.btn.red{background:var(--rouge)}
.btn.violet{background:var(--violet)}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--rouge) 30%,transparent)}}
.btn:focus-visible,.stage:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 11px;flex:1;min-width:0}
.marks{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.theory{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:2px 14px 8px;margin-bottom:12px}
.theory summary{cursor:pointer;font-weight:600;padding:10px 0;line-height:1.3}
.theory-body{font-size:.98rem;line-height:1.5}
.theory-body p{margin:.5em 0}
.theory-body ul{margin:.4em 0;padding-left:1.15em}
.theory-body li{margin:.3em 0}
.theory-body i{font-style:normal;font-weight:600;color:var(--bleu)}
.known{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:40px;padding:0 10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-weight:600;font-size:.9rem;line-height:1.1;cursor:pointer}
.known input{width:20px;height:20px;margin:0;accent-color:var(--ok);cursor:pointer}
.item.done .known{border-color:var(--ok);background:var(--paper)}
.known:focus-within{outline:3px solid var(--rouge);outline-offset:2px}
.forgot-mark input{accent-color:var(--warn)}
.item.forgot{border-color:var(--warn);background:var(--warnbg)}
.item.forgot .num{background:var(--warn);color:#fff;border-color:var(--warn)}
.item.forgot .forgot-mark{border-color:var(--warn);background:var(--paper)}
.substages{display:flex;gap:6px;overflow-x:auto;padding:2px}
.hint{color:var(--soft);font-size:.95rem;margin:0 0 4px}

.fb{border-radius:12px;padding:8px 12px;font-size:.98rem}
.fb.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.fb.bad{background:var(--badbg)}
.fb .said{margin:2px 0}
.w-ok{color:var(--ok);font-weight:600}
.w-bad{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.w-extra{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.tip{margin-top:6px;color:var(--ink)}
.fb .said{font-size:1.12rem;margin:2px 0 4px}
.fb .lbl{font-size:.9rem;color:var(--soft);font-weight:400}
.fb.ok .said{color:var(--ink);font-weight:400}
.fb.live{background:var(--bg);font-size:1.1rem}
.fb .note{font-size:.9rem;color:var(--soft);font-weight:400;margin-top:2px}
.w-near{color:#C77700;font-weight:600;text-decoration:underline dotted}
.w-dim{color:var(--soft)}
.tip::before{content:"🐈 "}

.opts{display:grid;gap:6px}
.opt{font:inherit;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through}
.q{font-size:1.15rem;font-weight:600}

.speed{display:flex;align-items:center;gap:8px;color:var(--soft);font-size:.95rem}
.speed input{flex:1}
.notice{background:var(--badbg);border-radius:14px;padding:10px 14px}

.aqua{position:relative;border-radius:24px 24px 18px 18px;overflow:hidden;border:3px solid var(--ink);background:var(--bg)}
.aqua svg{display:block;width:100%;height:auto}
.aqua-empty{position:absolute;right:10px;top:12px;width:44%;text-align:center;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px 14px 4px 14px;font-weight:500;font-size:.85rem;line-height:1.25;z-index:3;padding:6px 10px}
.paw{animation:pat 5s ease-in-out infinite}
@keyframes pat{0%,34%{transform:rotate(-24deg)}46%{transform:rotate(4deg)}51%{transform:rotate(-7deg)}56%{transform:rotate(4deg)}61%{transform:rotate(-7deg)}66%{transform:rotate(4deg)}80%,100%{transform:rotate(-24deg)}}
.poke{transform-box:fill-box;transform-origin:center;animation:wig 5s ease-in-out infinite}
@keyframes wig{0%,45%{transform:none}50%{transform:translateY(-3px) rotate(-14deg)}56%{transform:translateY(0) rotate(9deg)}62%{transform:translateY(-3px) rotate(-10deg)}68%{transform:translateY(0) rotate(6deg)}74%,100%{transform:none}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 4s ease-in-out infinite alternate}
@keyframes breath{from{transform:scaleY(1)}to{transform:scaleY(1.035)}}
.win{text-align:center;padding:24px 16px}
.win .big{font-size:3rem}
details summary{cursor:pointer;color:var(--soft);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:480px){.cat{font-size:50px}.fr{font-size:1.12rem}}
@media (max-width:600px){
  .item.sp .item-top{flex-wrap:wrap;align-items:center}
  .item.sp .item-top .num{order:1}
  .item.sp .item-top .marks{order:2}
  .item.sp .marks{gap:6px;flex-wrap:nowrap}
  .item.sp .known{padding:0 8px;gap:5px;font-size:.85rem}
  .item.sp .known input{width:18px;height:18px}
  .item.sp .item-top .texts{order:3;flex:1 1 100%}
  .item.sp .item-top > .btn{order:4;flex:1 1 100%;min-height:54px;font-size:1.05rem}
  .item.sp .actions{flex-direction:column;align-items:stretch}
  .item .actions .btn{flex:none;width:100%;min-height:54px;font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="flag" aria-hidden="true"></span>Français avec Marcel</h1>
    <div class="pill" id="shrimpTop">🦐 Crevettes : 0</div>
  </header>

  <section class="marcel" aria-live="polite">
    <div class="cat" id="cat" aria-hidden="true">🐈</div>
    <div class="bubble"><div class="fr" id="sayFr"></div><div class="ru" id="sayRu"></div></div>
  </section>

  <section class="panel">
    <div class="level-row">
      <div class="level-num" id="levelNum"></div>
      <div class="construction" id="construction"></div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" id="barWrap"><span id="bar"></span></div>
    <div class="prog" id="prog"></div>
    <div class="speed" style="margin-top:8px"><span>🐢</span><input type="range" id="rate" min="0.5" max="1.1" step="0.1" value="0.8" aria-label="Скорость озвучки"><span>🐇</span></div>
  </section>

  <div id="micNotice"></div>

  <nav class="stages" id="stages" aria-label="Этапы"></nav>

  <main id="main"></main>

  <section class="panel" aria-label="Марсель и миска с креветками">
    <div class="aqua" id="aqua"></div>
    <details style="margin-top:10px">
      <summary>⚙️ Настройки</summary>
      <div class="actions" style="margin-top:10px">
        <button class="btn ghost" id="restartLevel">Начать уровень заново</button>
        <button class="btn ghost" id="resetAll">Сбросить весь прогресс</button>
        <button class="btn ghost" id="adminBtn" aria-pressed="false">🔑 Админ</button>
      </div>
      <div class="actions" id="adminBox" hidden style="margin-top:10px">
        <button class="btn violet" id="nextLevelBtn">⏭ Сразу на следующий уровень</button>
        <label style="display:flex;gap:6px;align-items:center">Уровень <select id="levelPick" style="font:inherit;padding:6px;border-radius:10px"></select></label>
      </div>
    </details>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- DATA ---------- */
const BUILTIN = {"1": {fr: "Je veux + nombre + nom", ru: "Я хочу + количество + предмет", phrases: [["Je ne veux pas de pomme.", "Я не хочу яблоко."], ["Je veux trois bananes.", "Я хочу три банана."], ["Je veux quatre carottes.", "Я хочу четыре морковки."], ["Je veux six œufs.", "Я хочу шесть яиц."], ["Je ne veux pas de lait.", "Я не хочу молоко."], ["Je ne veux pas vingt et un citrons.", "Я не хочу двадцать один лимон."], ["Je veux dix yaourts.", "Я хочу десять йогуртов."], ["Je ne veux pas douze crevettes.", "Я не хочу двенадцать креветок."], ["Je veux treize abricots.", "Я хочу тринадцать абрикосов."], ["Je ne veux pas quinze pêches.", "Я не хочу пятнадцать персиков."], ["Je veux dix-sept oignons.", "Я хочу семнадцать луковиц."], ["Je veux dix-neuf radis.", "Я хочу девятнадцать редисок."], ["Je veux vingt sardines.", "Я хочу двадцать сардин."], ["Je veux vingt-deux poivrons.", "Я хочу двадцать два перца."], ["Je veux vingt-cinq tomates.", "Я хочу двадцать пять помидоров."], ["Je ne veux pas trente-six bonbons.", "Я не хочу тридцать шесть конфет."], ["Je veux quarante-deux courgettes.", "Я хочу сорок два кабачка."], ["Je veux soixante et onze baguettes.", "Я хочу семьдесят один багет."], ["Je veux quatre-vingt-trois bouteilles de lait.", "Я хочу восемьдесят три бутылки молока."], ["Je veux cent pains au chocolat.", "Я хочу сто булочек с шоколадом."]]}, "2": {fr: "J'ai…", ru: "У меня есть…", phrases: [["J'ai vingt-trois voitures.", "У меня есть двадцать три машины."], ["Je n'ai pas de sœur.", "У меня нет сестры."], ["J'ai quatre-vingt-trois réservations.", "У меня есть восемьдесят три брони."], ["J'ai deux sœurs.", "У меня есть две сестры."], ["J'ai cinq chats.", "У меня есть пять котов."], ["Je n'ai pas de voiture.", "У меня нет машины."], ["J'ai trois chiens.", "У меня есть три собаки."], ["J'ai douze billets.", "У меня есть двенадцать билетов."], ["Je n'ai pas douze euros.", "У меня нет двенадцати евро."], ["J'ai trente-six questions.", "У меня есть тридцать шес 1:{t:"Je veux + число + предмет",h:`
<p><b>Je veux</b> значит «я хочу». Глагол <i lang="fr">vouloir</i> меняется так — <i lang="fr">je veux, tu veux, il veut</i>. После него сразу называем число и предмет — <i lang="fr">Je veux trois bananes.</i></p>
<p><b>Один</b> это <i lang="fr">un</i> или <i lang="fr">une</i>, и род надо учить вместе со словом (<i lang="fr">un croissant, une pomme</i>). Если предметов несколько, к слову добавляется <i lang="fr">-s</i>, но на слух его не слышно. Слышно только число.</p>
<ul><li>1–16 учим как есть — <i lang="fr">un, deux, trois, quatre, cinq, six, sept, huit, neuf, dix, onze, douze, treize, quatorze, quinze, seize</i></li>
<li>17–19 это «десять и …» — <i lang="fr">dix-sept, dix-huit, dix-neuf</i></li>
<li>20, 30, 40, 50, 60 — <i lang="fr">vingt, trente, quarante, cinquante, soixante</i>. Дальше через дефис <i lang="fr">vingt-deux, trente-six</i>, а 21, 31, 41, 51, 61 с <i lang="fr">et un</i> (<i lang="fr">vingt et un</i>)</li>
<li>70 это 60+10 — <i lang="fr">soixante-dix</i>, 71 — <i lang="fr">soixante et onze</i>, 72 — <i lang="fr">soixante-douze</i></li>
<li>80 это 4×20 — <i lang="fr">quatre-vingts</i>, 81 — <i lang="fr">quatre-vingt-un</i>, 90 — <i lang="fr">quatre-vingt-dix</i>, 99 — <i lang="fr">quatre-vingt-dix-neuf</i></li>
<li>100 — <i lang="fr">cent</i></li></ul>
<p><b>Отрицание</b> строится как <i lang="fr">ne … pas</i> вокруг глагола — <i lang="fr">Je ne veux pas douze crevettes.</i> Если после «не хочу» стоит предмет без числа, то <i lang="fr">un / une / du</i> меняются на <i lang="fr">de</i> (перед гласной <i lang="fr">d'</i>) — <i lang="fr">Je ne veux pas de pomme.</i></p>`},
2:{t:"J'ai… (у меня есть…)",h:`
<p><b>J'ai</b> буквально «я имею» и значит «у меня есть». Глагол <i lang="fr">avoir</i> — <i lang="fr">j'ai, tu as, il a</i>. Русское «у меня есть» и «у меня» по-французски всегда <i lang="fr">J'ai</i>.</p>
<p>Если предметов несколько, называем число и добавляем <i lang="fr">-s</i> — <i lang="fr">J'ai vingt-trois voitures.</i> Мера, вес и объём соединяются с предметом словом <i lang="fr">de</i> — <i lang="fr">deux litres de lait, deux cent cinquante grammes de beurre.</i></p>
<ul><li>Возраст по-французски «имеют» — <i lang="fr">J'ai vingt-huit ans.</i> (мне 28 лет)</li>
<li>С 100 — <i lang="fr">cent</i>. Если сотни умножены и после них нет числа, то <i lang="fr">cents</i> (<i lang="fr">deux cents</i>), а если число есть, то без <i lang="fr">s</i> (<i lang="fr">deux cent cinquante</i>)</li></ul>
<p><b>Отрицание</b> <i lang="fr">Je n'ai pas …</i> С числом артикль не нужен — <i lang="fr">Je n'ai pas douze euros.</i> Без числа вместо <i lang="fr">un / une / des</i> ставим <i lang="fr">de</i> или <i lang="fr">d'</i> — <i lang="fr">Je n'ai pas de sœur. Je n'ai pas d'amis.</i></p>`},
3:{t:"Je prends… (я беру…)",h:`
<p><b>Je prends</b> от глагола <i lang="fr">prendre</i> — <i lang="fr">je prends, tu prends, il prend</i>. У него несколько значений «беру/покупаю» (<i lang="fr">Je prends deux croissants.</i>), «еду на транспорте» (<i lang="fr">Je prends le bus.</i>), «заказываю» (<i lang="fr">Je prends un café.</i>) и «фотографирую» (<i lang="fr">Je prends une photo.</i>).</p>
<p>Определённые артикли <i lang="fr">le, la, l'</i> (конкретный предмет) и неопределённые <i lang="fr">un, une</i> (любой). Меры и вес идут через <i lang="fr">de</i> — <i lang="fr">un kilo de poires, trois kilos de fraises, un demi-litre de jus.</i></p>
<p><b>Отрицание</b> <i lang="fr">Je ne prends pas …</i> Артикли <i lang="fr">un / une / du</i> меняются на <i lang="fr">de</i> (<i lang="fr">Je ne prends pas de café.</i>), а <i lang="fr">le / la / ce / cette</i> и числа остаются (<i lang="fr">Je ne prends pas le bus. Je ne prends pas cette robe.</i>).</p>`},
4:{t:"Je voudrais… (я бы хотела…)",h:`
<p><b>Je voudrais</b> это вежливая форма от <i lang="fr">vouloir</i>. Она мягче, чем <i lang="fr">Je veux</i>, и подходит для кафе, магазина, отеля. Лучше всего добавлять <i lang="fr">s'il vous plaît</i> (пожалуйста).</p>
<ul><li>После него стоит существительное — <i lang="fr">Je voudrais un café.</i></li>
<li>или глагол в начальной форме — <i lang="fr">Je voudrais payer. Je voudrais essayer.</i></li>
<li>Порции и меры через <i lang="fr">de</i> — <i lang="fr">un verre de vin, un litre de jus de pomme, deux boules de glace, une part de tarte.</i></li></ul>
<p><b>Отрицание</b> <i lang="fr">Je ne voudrais pas …</i> Вместо <i lang="fr">un / une / du</i> после <i lang="fr">pas</i> ставим <i lang="fr">de</i> — <i lang="fr">Je ne voudrais pas de dessert.</i></p>`},
5:{t:"Je cherche… (я ищу…)",h:`
<p><b>Je cherche</b> от глагола <i lang="fr">chercher</i> «искать». Предлог не нужен, как и в русском — <i lang="fr">Je cherche la gare.</i> Фразу удобно начинать с <i lang="fr">Excusez-moi,</i> (извините).</p>
<ul><li>Расстояние называем через <i lang="fr">à</i> — <i lang="fr">un café à deux cents mètres</i> (в двухстах метрах), <i lang="fr">un supermarché à deux kilomètres.</i></li>
<li>Площадь в «квадратных метрах» <i lang="fr">mètres carrés</i></li>
<li>Номера говорим словами и в конце — <i lang="fr">la chambre trente-deux, le quai neuf.</i></li></ul>
<p><b>Отрицание</b> <i lang="fr">Je ne cherche pas …</i> — <i lang="fr">un / une / des</i> становятся <i lang="fr">de</i> (<i lang="fr">Je ne cherche pas de travail.</i>), а <i lang="fr">la, le, mon</i> остаются (<i lang="fr">Je ne cherche pas la gare. Je ne cherche pas mon sac.</i>).</p>`},
6:{t:"Je peux avoir… ? (можно мне…?)",h:`
<p><b>Je peux avoir … ?</b> это просьба «можно мне …?». Глагол <i lang="fr">pouvoir</i> — <i lang="fr">je peux, tu peux, il peut</i>. В вопросе голос поднимается к концу, а перед знаком — <i lang="fr">?</i> по-французски ставится пробел. Вежливее добавить <i lang="fr">s'il vous plaît</i>.</p>
<ul><li>Для чего-то, что не считаем штуками, используем <i lang="fr">du / de la / de l'</i> («немного») — <i lang="fr">du sel, de l'eau.</i></li>
<li>Меры через <i lang="fr">de</i> — <i lang="fr">deux cuillères de sucre, deux boules de glace.</i></li></ul>
<p><b>Отрицание.</b> <i lang="fr">Je ne peux pas …</i> значит «я не могу» и после него идёт глагол в начальной форме — <i lang="fr">Je ne peux pas payer. Je ne peux pas venir.</i> Если дальше стоит <i lang="fr">un / du</i>, ставим <i lang="fr">de</i> — <i lang="fr">Je ne peux pas manger de fromage.</i></p>`},
7:{t:"Je vais + глагол (я собираюсь…)",h:`
<p><b>Je vais</b> от глагола <i lang="fr">aller</i> — <i lang="fr">je vais, tu vas, il va</i>. Если после него поставить другой глагол в начальной форме, получается ближайшее будущее «собираюсь / буду». Второй глагол не изменяется — <i lang="fr">Je vais manger. Je vais acheter deux billets.</i></p>
<ul><li>Это самый простой способ говорить о планах <i lang="fr">demain</i> (завтра), <i lang="fr">ce soir</i> (сегодня вечером)</li>
<li>Числа, меры и расстояния стоят так же, как в обычной фразе — <i lang="fr">Je vais marcher trois kilomètres.</i></li></ul>
<p><b>Отрицание</b> <i lang="fr">ne … pas</i> обнимает только <i lang="fr">vais</i>, а второй глагол остаётся на месте — <i lang="fr">Je ne vais pas manger.</i></p>`},
8:{t:"J'ai + причастие (я сделала…)",h:`
<p><b>Passé composé</b> это прошедшее время. Оно состоит из <i lang="fr">J'ai</i> и причастия, то есть особой формы глагола. Для русского «сделала, купила, поела» подходит одна конструкция.</p>
<ul><li>Глаголы на <i lang="fr">-er</i> получают <i lang="fr">-é</i> — <i lang="fr">manger → J'ai mangé, acheter → J'ai acheté, travailler → J'ai travaillé</i></li>
<li>Глаголы на <i lang="fr">-re</i> часто дают <i lang="fr">-u</i> — <i lang="fr">attendre → attendu, perdre → perdu</i></li>
<li>Неправильные нужно запомнить <i lang="fr">prendre → pris, lire → lu, écrire → écrit, faire → fait</i></li></ul>
<p>После <i lang="fr">J'ai</i> причастие обычно не меняется по роду и числу — <i lang="fr">J'ai pris le bus.</i></p>
<p><b>Отрицание</b> <i lang="fr">ne … pas</i> обнимает <i lang="fr">J'ai</i>, а причастие стоит после — <i lang="fr">Je n'ai pas mangé. Je n'ai pas oublié mon téléphone.</i></p>`},
9:{t:"Je suis… (я…)",h:`
<p><b>Je suis</b> от глагола <i lang="fr">être</i> — <i lang="fr">je suis, tu es, il est</i>. В русском «есть» обычно пропускается («я устала»), а во французском <i lang="fr">suis</i> нужен всегда — <i lang="fr">Je suis fatiguée.</i></p>
<ul><li>Для женщины к слову добавляется <i lang="fr">-e</i> — <i lang="fr">fatiguée, contente, occupée, perdue.</i></li>
<li>Профессия и роль идут без артикля — <i lang="fr">Je suis étudiante. Je suis touriste.</i></li>
<li>Место <i lang="fr">à</i> (<i lang="fr">à Nice, à l'hôtel, à la gare</i>), <i lang="fr">au</i> (= à + le, <i lang="fr">au restaurant</i>) и <i lang="fr">dans</i> (<i lang="fr">dans le bus</i>)</li>
<li>Расстояние <i lang="fr">à dix kilomètres de Nice</i> (в десяти километрах от Ниццы)</li></ul>
<p><b>Отрицание</b> <i lang="fr">Je ne suis pas …</i> — <i lang="fr">Je ne suis pas fatiguée. Je ne suis pas à l'hôtel.</i></p>`},
10:{t:"Il y a… (есть, имеется)",h:`
<p><b>Il y a</b> значит «есть, имеется» и всегда звучит одинаково. И для одного предмета, и для многих — <i lang="fr">Il y a un café. Il y a trois chambres.</i> Вопрос получается из той же фразы с вопросительной интонацией — <i lang="fr">Il y a un parc ?</i></p>
<ul><li>Расстояние через <i lang="fr">à</i> — <i lang="fr">Il y a un parc à deux kilomètres.</i> (в двух километрах есть парк)</li>
<li>Время ожидания — <i lang="fr">Il y a dix minutes d'attente.</i></li></ul>
<p><b>Отрицание</b> <i lang="fr">Il n'y a pas de …</i> После <i lang="fr">pas</i> всегда <i lang="fr">de</i> или <i lang="fr">d'</i> перед гласной — <i lang="fr">Il n'y a pas de café. Il n'y a pas d'ascenseur.</i></p>`},
11:{t:"В приложении: покупки",h:`
<p>На кнопках и в подсказках приложений французский почти всегда использует <b>начальную форму глагола</b> «Добавить», «Оплатить», «Найти» — <i lang="fr">Ajouter au panier. Payer. Rechercher un produit.</i> Это не команда человеку, а название действия.</p>
<ul><li><i lang="fr">le panier</i> корзина, <i lang="fr">la commande</i> заказ, <i lang="fr">l'achat</i> покупка, <i lang="fr">le produit</i> товар, <i lang="fr">la livraison</i> доставка, <i lang="fr">le code promo</i> промокод</li>
<li><i lang="fr">au</i> это <i lang="fr">à + le</i> (<i lang="fr">au panier</i>), <i lang="fr">aux</i> это <i lang="fr">à + les</i> (<i lang="fr">aux favoris</i>)</li>
<li><i lang="fr">disponible</i> «в наличии», <i lang="fr">pas disponible</i> «нет в наличии»</li></ul>
<p>Чтобы объяснить проблему, пригодится отрицание — <i lang="fr">Je ne trouve pas ce produit. Je n'ai pas reçu ma commande. Je n'ai pas de code promo.</i></p>`},
12:{t:"В приложении: аккаунт и настройки",h:`
<p>Здесь много <b>возвратных глаголов</b> с <i lang="fr">se</i>. В кнопке <i lang="fr">se</i> остаётся как есть <i lang="fr">Se connecter</i> (войти), <i lang="fr">Se déconnecter</i> (выйти).</p>
<ul><li><i lang="fr">mon / ma / mes</i> значит «мой, моя, мои» — <i lang="fr">mon profil, ma commande, mes adresses.</i> Форма зависит от рода и числа слова после</li>
<li><i lang="fr">un compte</i> аккаунт, <i lang="fr">un mot de passe</i> пароль, <i lang="fr">les paramètres</i> настройки, <i lang="fr">les notifications</i> уведомления</li>
<li><i lang="fr">activer</i> включить, <i lang="fr">désactiver</i> отключить, <i lang="fr">autoriser</i> разрешить, <i lang="fr">supprimer</i> удалить</li></ul>
<p>Отрицание в живой речи — <i lang="fr">Je n'ai pas de compte. Je ne veux pas de notifications.</i> А <i lang="fr">du</i> в <i lang="fr">Je ne me souviens pas du mot de passe</i> это <i lang="fr">de + le</i>.</p>`},
13:{t:"В приложении: кнопки и сообщения",h:`
<p>Короткие слова в интерфейсе бывают трёх видов.</p>
<ul><li><b>Названия разделов</b> (существительные) — <i lang="fr">Accueil, Retour, Aide.</i></li>
<li><b>Действия</b> в начальной форме или в повелительной — <i lang="fr">Valider, Annuler, Enregistrer, Supprimer, Partager, Télécharger.</i> Все они заканчиваются на <i lang="fr">-er</i>, поэтому читаются похоже</li>
<li><b>Сообщения системы</b> <i lang="fr">Chargement en cours</i> (идёт загрузка), <i lang="fr">Une erreur est survenue</i> (произошла ошибка), <i lang="fr">Aucun résultat</i> (ничего не найдено), <i lang="fr">Pas de connexion internet</i> (нет интернета)</li></ul>
<p>Если что-то не получается, говорим с отрицанием — <i lang="fr">Je ne comprends pas. Je ne trouve pas le bouton.</i> А запрет действия в кнопке выглядит так — <i lang="fr">Ne pas enregistrer.</i></p>`}
};

/* ---------- CHECKING ---------- */
const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const TENS={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
// digits from speech recognition -> French words; a final "1" becomes "§1" (= un OR une)
function numFr(n){
  if(n<20) return n===1?"§1":U[n];
  if(n>=1000) return String(n);
  if(n>=100){ const h=Math.floor(n/100), r=n%100, c=h===1?"cent":U[h]+" cent"+(r===0?"s":""); return r?c+" "+numFr(r):c; }
  const t=Math.floor(n/10), u=n%10;
  if(t<=6) return TENS[t]+(u===0?"":u===1?" et §1":"-"+U[u]);
  if(t===7) return "soixante"+(u===1?" et onze":"-"+U[10+u]);
  if(t===8) return u===0?"quatre-vingts":"quatre-vingt-"+(u===1?"§1":U[u]);
  return "quatre-vingt-"+U[10+u];
}
const FILLERS=new Set(["euh","heu","bah","ben","hum","mmm"]);
function tokens(s){
  return s.toLowerCase().replace(/\d+/g,d=>" "+numFr(+d)+" ").replace(/[’`´]/g,"'").replace(/œ/g,"oe").replace(/æ/g,"ae")
    .replace(/[.,!?;:«»"()…]/g," ").replace(/-/g," ").replace(/'/g,"")
    .split(/\s+/).filter(w=>w && !FILLERS.has(w));
}
function deaccent(w){return w.normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function sound(w){ w=deaccent(w); return w.length>3 ? w.replace(/(ent|es|s|x|t|e)$/,"") : w.replace(/[sxt]$/,""); }
// "exact" | "near" (sounds the same) | "accent" (typed, accents differ) | false
function eq(t, s, mode){
  if(t===s) return "exact";
  if(s==="§1" && (t==="un"||t==="une")) return "exact";
  if(deaccent(t)===deaccent(s)) return mode==="speech" ? "near" : "accent";
  if(mode==="speech" && sound(t)===sound(s)) return "near";
  return false;
}
function check(target, said, mode){
  const T=tokens(target);
  const saidWords=said.trim().split(/\s+/), owner=[], S=[];
  saidWords.forEach((w,wi)=>tokens(w).forEach(tk=>{S.push(tk);owner.push(wi);}));
  const n=T.length, m=S.length, L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) L[i][j]= eq(T[i],S[j],mode) ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const tOk=Array(n).fill(false), sType=Array(m).fill(false);
  let i=0,j=0; while(i<n&&j<m){ const e=eq(T[i],S[j],mode); if(e){ tOk[i]=true; sType[j]=e; i++;j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  const ok = tOk.every(Boolean) && sType.every(Boolean);
  const near = sType.some(x=>x==="near"), accent = sType.some(x=>x==="accent");
  // target words
  const shown=target.replace(/-/g," ").split(/\s+/);
  let k=0; const tHtml=shown.map(w=>{ const parts=tokens(w); if(!parts.length) return esc(w); let good=true; parts.forEach(()=>{ if(!tOk[k++]) good=false; }); return '<span class="'+(good?"w-ok":"w-bad")+'">'+esc(w)+'</span>'; }).join(" ");
  // what she actually said, word by word
  const sHtml=saidWords.map((w,wi)=>{
    const types=sType.filter((_,x)=>owner[x]===wi);
    if(!types.length) return '<span class="w-dim">'+esc(w)+'</span>';
    const cls = types.includes(false) ? "w-extra" : types.some(t=>t==="near"||t==="accent") ? "w-near" : "w-ok";
    return '<span class="'+cls+'">'+esc(w)+'</span>';
  }).join(" ");
  return {ok, near, accent, tHtml, sHtml};
}

  me.onstart=()=>{btn.classList.add("listening");btn.textContent="⏹ Stop"; if(onLive) onLive("…"); arm(8000);};
  me.onresult=e=>{
    const fin=[], tmp=[];
    for(const r of e.results){ (r.isFinal?fin:tmp).push(r[0].transcript.trim()); }
    got=fin.join(" ").trim(); heard=fin.concat(tmp).join(" ").trim();
    if(onLive) onLive(heard||"…");
    arm(1500);
  };
  me.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){ micBroken=true; renderNotice(); renderMain(); }
    else if(e.error==="no-speech") toast("Je n'ai rien entendu. Parle un peu plus fort 🎤");
  };

    if(rec===me){ rec=null; recBtn=null; }
    const text=(got||heard).trim();
    if(text) onText(text); else if(onLive) onLive("rien entendu, essaie encore"); };

}

const isRev=k=>k.indexOf("rev_")===0;
function stageCount(k){
  if(k==="rev") return 3*state.forgot.length;

function doneCount(k){
  if(k==="rev") return REV_SUBS.reduce((n,x)=>n+doneCount(x.key),0);

  return state.done[k].filter(Boolean).length;
}

function revDone(){ return doneCount("rev")>=stageCount("rev"); }

// «Повтор» открывается после «Dis-le», «Test final» — когда нечего повторять или всё повторено
function syncUnlock(){
  if(doneCount("dis")<stageCount("dis")) return;
  state.unlocked = revDone() ? Math.max(state.unlocked,4) : 3;
}
// у каждой вкладки свой порядок карточек, он сохраняется на весь уровень
function range(n){ return Array.from({length:n},(_,i)=>i); }
function makeOrder(n){
  let ass,dis,fin;
  do{ ass=shuffle(range(n)); dis=shuffle(range(n)); fin=shuffle(range(n)); }while([ass[0],dis[0],fin[0]].some(x=>x===0) || new Set([ass[0],dis[0],fin[0]]).size<3);
  return {lv:state.level, n, rep:range(n), ass, dis, fin};
}
function order(name){
  const d=levelData(state.level), n=d?d.phrases.length:20;
  if(!state.order || state.order.lv!==state.level || state.order.n!==n || !state.order.fin || state.order.fin.length!==n){ state.order=makeOrder(n); save(); }

}
// state.fg хранит отметки по этапам («Associe», «Dis-le»), state.forgot — все отложенные карточки для шага «Повтор»
function syncForgot(){ state.forgot=[...new Set([...state.fg.ass,...state.fg.dis,...state.fg.fin])].sort((x,y)=>x-y); }
function setForgot(idx,on,stage){
  const had=state.forgot.indexOf(idx)>=0, a=state.fg[stage], i=a.indexOf(idx);
  if(on && i<0) a.push(idx);

  if(on && !had){ ["rev_rep","rev_ass","rev_dis"].forEach(r=>{ state.done[r][idx]=false; }); if(stage!=="fin" && state.unlocked>=4 && !state.won) state.unlocked=3; }

// за каждую из четырёх вкладок («Écoute & répète», «Associe», «Dis-le», «Test final») одна креветка за уровень
function award(k){ if(state.earned[k]) return false; state.earned[k]=true; state.shrimps++; return true; }
function stageComplete(k){
  if(k==="fin"){ const got=award("fin"); state.won=true; toast(got?"Bravo ! +1 🦐 Niveau terminé !":"Bravo ! Niveau terminé !"); }
  else if(k==="rep"||k==="ass"){

  }

function speechItem(idx, fr, ru, k, ruOnly, n){
  const canForget = k==="dis" || k==="fin";
  const isForgot = canForget && state.fg[k].indexOf(idx)>=0, settled = state.done[k][idx] || isForgot;
  const el=document.createElement("article"); el.className="item sp"+(isForgot?" forgot":state.done[k][idx]?" done":"");

    '<div class="actions"></div><div class="fbwrap"></div>';

  if(!ruOnly || settled){
    const lb=document.createElement("button"); lb.className="btn"; lb.textContent="🔊 Écouter"; lb.onclick=()=>speak(fr); actions.appendChild(lb);
  }

  const refresh=(sel,full)=>{
    if(!el.isConnected) return;
    if(full || (k==="dis" && doneCount("dis")>=stageCount("dis"))){ const y=window.scrollY; renderMain(); window.scrollTo(0,y); return; }
    const fresh=speechItem(idx, fr, ru, k, ruOnly, n); el.replaceWith(fresh); const c=fresh.querySelector(sel); if(c) c.focus({preventScroll:true});
  };
  cb.onchange=()=>{
    if(cb.checked){
      if(isForgot){ setForgot(idx,false,k); if(state.done[k][idx]){ syncUnlock(); save(); renderHeader(); } else markDone(k, idx); }
      else markDone(k, idx);
    } else unmarkDone(k, idx);
    refresh(".known input", k==="fin" && isForgot);
  };
  const marks=document.createElement("div"); marks.className="marks"; marks.appendChild(known);
  if(canForget){
    const fg=document.createElement("label"); fg.className="known forgot-mark";
    fg.innerHTML='<input type="checkbox"> Je ne sais plus';
    const fc=fg.querySelector("input"); fc.checked=isForgot;
    fc.onchange=()=>{
      if(fc.checked){
        setForgot(idx,true,k);
        if(k==="fin"){ if(state.done.fin[idx]) unmarkDone("fin", idx); else { save(); renderHeader(); } }  // в финальном тесте карточка ждёт повтора и не засчитывается
        else if(state.done.dis[idx]){ syncUnlock(); save(); renderHeader(); } else markDone("dis", idx, true);
      } else {
        setForgot(idx,false,k);
        if(k==="fin"){ save(); renderHeader(); } else unmarkDone("dis", idx);
      }
      refresh(".forgot-mark input", k==="fin");
    };
    marks.appendChild(fg);
  }
  el.querySelector(".item-top").appendChild(marks);
  if(settled){ return el; }
  const handle=(said, mode)=>{
    const res=check(fr, said, mode);
    fbw.innerHTML=feedbackHtml(res, said, fr, ruOnly, mode);
    if(res.ok){ el.classList.remove("wrong"); markDone(k, idx); el.classList.add("done"); el.querySelector(".num").textContent="✓";
      if(ruOnly){ const t=el.querySelector(".texts"); if(!t.querySelector(".fr")) t.insertAdjacentHTML("afterbegin",'<div class="fr" lang="fr">'+esc(fr)+'</div>'); }
      actions.querySelectorAll(".mic").forEach(x=>x.remove()); cb.checked=true;
    } else {

    }

  }

}

/* варианты похожи на правильный ответ, порядок каждый раз новый */
function wordsOf(t){ return new Set(t.toLowerCase().replace(/[’'\-.,!?;:«»"()…]/g," ").split(/\s+/).filter(Boolean)); }
function jacc(a,b){ let n=0; a.forEach(x=>{ if(b.has(x)) n++; }); return n/((a.size+b.size-n)||1); }
function lev(a,b){
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){ const cur=[i]; for(let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[b.length];
}
function sim(a,b){ return jacc(wordsOf(a),wordsOf(b)) + 1 - lev(a,b)/(Math.max(a.length,b.length)||1); }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
/* ---------- очень похожие неправильные варианты для «Associe» ---------- */
const FR_NUM={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16,vingt:20,vingts:20,trente:30,quarante:40,cinquante:50,soixante:60,cent:100,cents:100};
function frWords(n){
  if(n<20) return U[n];
  if(n<70){ const t=Math.floor(n/10), u=n%10; return TENS[t]+(u===0?"":u===1?" et un":"-"+U[u]); }
  if(n<80) return n===71 ? "soixante et onze" : "soixante-"+U[n-60];
  if(n<100) return n===80 ? "quatre-vingts" : "quatre-vingt-"+U[n-80];
  const h=Math.floor(n/100), r=n%100, c=h===1?"cent":U[h]+" cent"+(r===0?"s":"");
  return r ? c+" "+frWords(r) : c;
}
function frParse(words){
  let total=0, cur=0, prev="";
  for(const t of words){
    if(t==="et") continue;
    if(t==="vingt"||t==="vingts") cur = prev==="quatre" ? cur-4+80 : cur+20;
    else if(t==="cent"||t==="cents"){ cur=(cur||1)*100; total+=cur; cur=0; }
    else cur+=FR_NUM[t];
    prev=t;
  }
  return total+cur;
}
const WORD_RE=/[A-Za-zÀ-ÿŒœ]+|[^A-Za-zÀ-ÿŒœ]+/g;
function isWord(p){ return /^[A-Za-zÀ-ÿŒœ]/.test(p); }
// числа во фразе: [{from, to (индексы частей), words, value}]
function frRuns(parts){
  const runs=[]; let i=0;
  while(i<parts.length){
    if(isWord(parts[i]) && FR_NUM[parts[i].toLowerCase()]!==undefined){
      let j=i, words=[parts[i].toLowerCase()];
      while(j+2<parts.length && /^[ -]$/.test(parts[j+1])){
        const w=parts[j+2].toLowerCase();
        if(FR_NUM[w]!==undefined || (w==="et" && parts[j+4] && FR_NUM[parts[j+4].toLowerCase()]!==undefined)){ words.push(w); j+=2; } else break;
      }
      runs.push({from:i, to:j, words, value:frParse(words)}); i=j+1;
    } else i++;
  }
  return runs;
}
// «Je veux …» ↔ «Je ne veux pas …»: самый похожий неверный вариант
function dePlural(t){ return t.replace(/pas (?:un |une |du |des |de la |de l')(\S+)/, (m,w)=>"pas "+(/^[aeiouyhéèêàâîôûœ]/i.test(w)?"d'":"de ")+w); }
function frNegate(t){
  let r=null, m;
  if((m=t.match(/^Je (veux|prends|voudrais|cherche|peux|vais|suis)\b/))) r=t.replace(/^Je (\S+)/,"Je ne $1 pas");
  else if(/^J'ai\b/.test(t)) r=t.replace(/^J'ai/,"Je n'ai pas");
  else if(/^Il y a\b/.test(t)) r=t.replace(/^Il y a/,"Il n'y a pas");

}
function frAffirm(t){

  if(/^Je ne \S+ pas /.test(t)) r=t.replace(/^Je ne (\S+) pas /,"Je $1 ");

}
function numNeighbours(n){
  const s=new Set(), t=String(n);
  if(t.length>=2){ const sw=+(t[t.length-1]+t.slice(0,-1).split("").reverse().join("")); if(sw!==n && sw>=2) s.add(sw); }
  if(t.length===2 && t[0]!==t[1]){ const sw=+(t[1]+t[0]); if(sw>=2) s.add(sw); }
  [1,-1,10,-10].forEach(k=>{ if(n+k>=2 && n+k<1000) s.add(n+k); });
  if(n>=2&&n<=9) s.add(n+10);
  if(n>=12&&n<=19){ s.add(n-10); s.add((n-10)*10); }
  if(n>=20&&n<=90&&n%10===0){ s.add(n/10+10); }
  if(n>=100&&n%100===0){ s.add(n+10); s.add(n/100+10); }
  if(n>=101){ const h=Math.floor(n/100), r=n%100; if(r>=10){ s.add(h*100+(r%10)*10+Math.floor(r/10)); } }
  s.delete(n); return [...s].filter(x=>x>=2&&x<1000);
}

function keepCase(src,dst){ return src[0]!==src[0].toLowerCase() ? dst[0].toUpperCase()+dst.slice(1) : dst; }
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }
function misspell(w){
  const lw=w.toLowerCase(), out=[];
  for(const [i,ch] of [...lw].entries()) if(ACCENT[ch]) ACCENT[ch].forEach(r=>out.push(lw.slice(0,i)+r+lw.slice(i+1)));
  for(const [a,b] of SPELL_OPS){ let at=lw.indexOf(a,1); while(at>=0){ out.push(lw.slice(0,at)+b+lw.slice(at+a.length)); at=lw.indexOf(a,at+1); } }
  for(let i=1;i<lw.length-1;i++) if("tlnmrsfpc".includes(lw[i]) && "aeiouyéèêàâîôû".includes(lw[i-1]) && "aeiouyéèêàâîôû".includes(lw[i+1])) out.push(lw.slice(0,i)+lw[i]+lw.slice(i));
  if(lw.length>4 && lw.endsWith("s")) out.push(lw.slice(0,-1));
  return out.filter(x=>x!==lw && !/^œ/.test(lw)).map(x=>keepCase(w,x));
}
// варианты французской фразы с одной «ошибкой»: числа, созвучные слова, правописание, род
function frVariants(text){
  const parts=text.match(WORD_RE)||[], runs=frRuns(parts), inRun=new Set(); runs.forEach(r=>{ for(let k=r.from;k<=r.to;k++) inRun.add(k); });
  const res=[], join=a=>a.join("");
  const ng=frAffirm(text)||frNegate(text); if(ng && ng!==text) res.push({type:"neg", text:ng});
  runs.forEach(r=>{
    const last=parts[r.to].toLowerCase();
    if(r.value===1){ const sw={un:"une",une:"un"}[last]; if(sw) res.push({type:"gender", text:join([...parts.slice(0,r.to),keepCase(parts[r.to],sw),...parts.slice(r.to+1)])}); return; }
    numNeighbours(r.value).forEach(n=>{
      let w=frWords(n); if(/ un$/.test(w)||w==="un"){ if(last!=="un"&&last!=="une") return; w=w.replace(/un$/,last); }
      res.push({type:"num", text:join([...parts.slice(0,r.from), keepCase(parts[r.from],w), ...parts.slice(r.to+1)])});
    });
  });
  parts.forEach((p,i)=>{
    if(!isWord(p) || inRun.has(i)) return;
    const lw=p.toLowerCase();
    (HOM[lw]||[]).forEach(alt=>{ if(alt!==lw) res.push({type:"hom", text:join([...parts.slice(0,i),keepCase(p,alt),...parts.slice(i+1)])}); });
    if(lw.length>=4) misspell(p).forEach(alt=>res.push({type:"spell", text:join([...parts.slice(0,i),alt,...parts.slice(i+1)])}));
  });
  return res;
}

const RU_TENS=["двадцать","тридцать","сорок","пятьдесят","шестьдесят","семьдесят","восемьдесят","девяносто"], RU_HUND=["сто","двести","триста","четыреста","пятьсот","шестьсот","семьсот","восемьсот","девятьсот"];

const RU_NUMS=new Set(["один","одно","одна","два","две","три","четыре",...RU_UNITS,...RU_TEENS,...RU_TENS,...RU_HUND]);
function ruVariants(text){
  const parts=text.match(/[А-Яа-яЁё]+|[^А-Яа-яЁё]+/g)||[], res=[];
  const tg=ruNegToggle(text); if(tg) res.push({type:"neg", text:tg});
  let i=0;
  while(i<parts.length){
    if(!(/^[А-Яа-яЁё]/.test(parts[i]) && RU_NUMS.has(parts[i].toLowerCase()))){ i++; continue; }
    let j=i; while(j+2<parts.length && parts[j+1]===" " && RU_NUMS.has(parts[j+2].toLowerCase())) j+=2;
    const compound=j>i;
    for(let k=i;k<=j;k+=2){
      const w=parts[k].toLowerCase(), isLast=k===j, same=set=>set.includes(w)?set:null;
      const cls=["один","одно","одна"].includes(w)?"1":["два","две","три","четыре"].includes(w)?"A":"B";
      let alts=RU_ALT[w]||[];
      if(!isLast) { const set=same(RU_TENS)||same(RU_HUND); alts=set?alts.filter(a=>set.includes(a)):[]; }
      else if(cls==="1") alts=[];
      else if(cls==="A") alts=alts.filter(a=>["три","четыре"].includes(a));
      else if(compound){ const set=same(RU_UNITS)||same(RU_TENS)||same(RU_TEENS)||same(RU_HUND); alts=set?alts.filter(a=>set.includes(a)):[]; }
      else alts=alts.filter(a=>!["два","две","три","четыре"].includes(a));
      alts.forEach(a=>res.push({type:"num", text:[...parts.slice(0,k),keepCase(parts[k],a),...parts.slice(k+1)].join("")}));
    }
    i=j+1;

}
const normText=t=>t.toLowerCase().replace(/[^a-zà-ÿœа-яё0-9]+/g,"");
// два самых похожих неверных варианта: сначала «числа» и «правописание/созвучие», потом ближайшие карточки уровня
function pickDistractors(idx,d,toRu){
  const [fr,ru]=d.phrases[idx], col=toRu?1:0, right=d.phrases[idx][col], seen=new Set([normText(right)]);
  const vars=toRu ? ruVariants(ru) : frVariants(fr);
  const byType={}; shuffle(vars).forEach(v=>{ (byType[v.type]=byType[v.type]||[]).push(v); });
  const picks=[], take=v=>{ const k=normText(v.text); if(seen.has(k)) return false; seen.add(k); picks.push({i:-1,text:v.text}); return true; };
  const order=shuffle(Object.keys(byType)); ["neg","num"].forEach(t=>{ if(order.includes(t)){ order.splice(order.indexOf(t),1); order.unshift(t); } });
  for(const t of order){ if(picks.length>=2) break; for(const v of byType[t]){ if(take(v)) break; } }
  for(const t of order){ if(picks.length>=2) break; for(const v of byType[t]){ if(picks.length>=2) break; take(v); } }
  if(picks.length<2){
    const near=d.phrases.map((p,i)=>({i, text:p[col], score:sim(p[0],fr)+sim(p[1],ru)})).filter(c=>c.i!==idx).sort((x,y)=>y.score-x.score).slice(0,6);
    for(const c of shuffle(near)){ if(picks.length>=2) break; take(c); }
  }
  return picks;
}

function assItem(idx, d, k, n){
  k=k||"ass"; const [fr,ru]=d.phrases[idx], toRu = idx%2===0 && ruVariants(ru).length>0, col=toRu?1:0, right=d.phrases[idx][col];
  const opts=shuffle([{i:idx, text:right},...pickDistractors(idx,d,toRu)]);
  const pos=n, isForgot = k==="ass" && state.fg.ass.indexOf(idx)>=0;
  const el=document.createElement("article"); el.className="item sp"+(isForgot?" forgot":state.done[k][idx]?" done":"");
  el.innerHTML='<div class="item-top"><div class="num">'+(isForgot?"↻":state.done[k][idx]?"✓":(n||idx+1))+'</div><div class="texts"><div class="q"'+(toRu?' lang="fr"':"")+'>'+esc(toRu?fr:ru)+'</div></div></div><div class="opts"></div><div class="fbwrap"></div>';
  if(toRu){ const lb=document.createElement("button"); lb.className="btn ghost"; lb.textContent="🔊 Écouter"; lb.onclick=()=>speak(fr); el.querySelector(".item-top").appendChild(lb); }
  if(k==="ass"){
    const fg=document.createElement("label"); fg.className="known forgot-mark";
    fg.innerHTML='<input type="checkbox"> Je ne sais plus';
    const fc=fg.querySelector("input"); fc.checked=isForgot;
    fc.onchange=()=>{
      if(fc.checked){ setForgot(idx,true,"ass"); if(state.done.ass[idx]){ save(); renderHeader(); } else markDone("ass", idx, true); }
      else { setForgot(idx,false,"ass"); unmarkDone("ass", idx); }
      if(!el.isConnected) return;
      if(doneCount("ass")>=stageCount("ass")){ const y=window.scrollY; renderMain(); window.scrollTo(0,y); return; }
      const fresh=assItem(idx,d,k,pos); el.replaceWith(fresh); const c=fresh.querySelector(".forgot-mark input"); if(c) c.focus({preventScroll:true});
    };
    const marks=document.createElement("div"); marks.className="marks"; marks.appendChild(fg);
    el.querySelector(".item-top").appendChild(marks);
  }
  const box=el.querySelector(".opts");
  opts.forEach((o,n)=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=String.fromCharCode(65+n)+". "+o.text;
    if(state.done[k][idx]){ b.disabled=true; if(o.i===idx) b.classList.add("right"); }
    b.onclick=()=>{
      if(o.i===idx){ b.classList.add("right"); box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        el.querySelector(".fbwrap").innerHTML='<div class="fb ok">Très bien ! ✅</div>'; el.classList.add("done"); el.querySelector(".num").textContent="✓"; markDone(k, idx); }
      else { b.classList.add("no"); b.disabled=true; el.querySelector(".fbwrap").innerHTML='<div class="fb bad"><b>Presque !</b> Essaie encore.</div>'; }
    };
    box.appendChild(b);
  });
  return el;
}

async function generateLevel(btn, out){
  const sample=await samplePromise;
  if(!sample){ out.textContent="Генерация недоступна в этом окне. Попроси Марселя в чате добавить фразы для этого уровня."; return; }
  const p=planFor(state.level);
  btn.disabled=true; out.textContent="Марсель готовит фразы… это может занять до минуты 🐈";
  const prompt=`Составь материалы для урока разговорного французского (уровень начинающий, ученица говорит по-русски).
Конструкция уровня: "${p.fr}" (${p.ru}). Темы: ${p.theme}.
Нужно ровно 20 коротких фраз, где КАЖДАЯ использует только эту конструкцию (меняются слова и числа).
Фразы — естественный современный разговорный французский, 3–7 слов, реальная бытовая лексика. Если в конструкции есть количество, используй числа от 1 до 100 (сначала маленькие, потом больше), всегда словами, а не цифрами. Перевод — естественный русский. Все русские переводы должны быть разными.
Ответь ТОЛЬКО JSON без пояснений: {"phrases":[["фраза fr","перевод ru"], ... 20 штук]}`;
  try{
    const data=await sample.json(prompt,{modelTier:"default"});
    if(!data || !Array.isArray(data.phrases) || data.phrases.length<20) throw {code:"bad"};
    generated[state.level]={fr:p.fr, ru:p.ru, phrases:data.phrases.slice(0,20)};
    save(); renderAll();
  }catch(e){
    btn.disabled=false;
    out.textContent = e && e.code==="not_granted" ? "Без разрешения Марсель не может подготовить фразы." :
      e && e.code==="rate_limited" ? "Слишком много запросов. Подожди минуту и попробуй снова." : "Не получилось подготовить фразы. Попробуй ещё раз.";
  }
}

function renderReview(m,d){

<ellipse cx="68" cy="176" rx="22" ry="11" fill="#efece6"/><path d="M58 180 v-8 M68 181 v-9 M78 180 v-8" stroke="#c9c2b6" stroke-width="1.6" stroke-linecap="round"/>`;
const PAW_SVG=`<g transform="translate(166 154)"><g class="paw">
<circle r="13" fill="#8a8478"/>
<path d="M0 -11 L88 -10 Q104 -10 104 0 Q104 10 88 11 L0 13 Z" fill="#8a8478"/>
<path d="M22 -6 q8 8 2 16 M50 -6 q8 8 2 16" stroke="#58534a" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".6"/>
<ellipse cx="98" cy="0" rx="17" ry="12" fill="#f4f1ea"/>
<path d="M108 -6 v12 M102 -8 v16 M96 -8 v16" stroke="#cfc8bc" stroke-width="1.6" stroke-linecap="round"/>
</g></g>`;
function sceneSVG(n){
  const shown=Math.min(n,24), pts=[];
  for(let i=0;i<shown;i++) pts.push({x:262+((i*29+7)%68), y:149+((i*13+3)%13), r:((i*53)%50)-25});
  const poke=new Set(pts.map((q,i)=>[q.x,i]).sort((a,b)=>a[0]-b[0]).slice(0,3).map(a=>a[1]));
  const shr=pts.map((q,i)=>'<g'+(poke.has(i)?' class="poke"':'')+'><text x="'+q.x+'" y="'+q.y+'" font-size="21" transform="rotate('+q.r+' '+q.x+' '+q.y+')">🦐</text></g>').join("");
  const bowlBack='<ellipse cx="305" cy="152" rx="58" ry="14" fill="#e9eefb" stroke="#3b5ab0" stroke-width="2"/><ellipse cx="305" cy="153" rx="51" ry="10" fill="#2f3f7a"/>';
  const bowlFront='<path d="M247 152 A58 14 0 0 0 363 152 Q358 192 305 192 Q252 192 247 152 Z" fill="#5b7fd6" stroke="#3b5ab0" stroke-width="2"/><path d="M257 170 Q305 184 353 170" stroke="#fff" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>';
  const more=n>24?'<text x="305" y="207" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">× '+n+'</text>':"";
  return '<svg viewBox="0 0 370 212" role="img" aria-label="Кот Марсель лежит рядом с миской и трогает креветок лапкой"><rect width="370" height="212" style="fill:var(--bg)"/><rect y="164" width="370" height="48" style="fill:var(--sand)"/>'+
    '<ellipse cx="108" cy="196" rx="108" ry="8" fill="#000" opacity=".12"/><ellipse cx="305" cy="196" rx="64" ry="7" fill="#000" opacity=".12"/>'+
    CAT_SVG+bowlBack+shr+bowlFront+PAW_SVG+more+'</svg>';
}
let aquaShown=-1;
function renderAqua(){
  if(aquaShown===state.shrimps) return;
  aquaShown=state.shrimps;
  const a=$("aqua"); a.innerHTML=sceneSVG(state.shrimps);
  if(!state.shrimps){ const e=document.createElement("div"); e.className="aqua-empty"; e.textContent="Миска пуста. Заработай первую креветку!"; a.appendChild(e); }
}
function renderAll(){ renderHeader(); renderNotice(); renderMain(); renderAqua(); renderAdmin(); }

$("restartLevel").onclick=()=>{ if(confirm("Начать текущий уровень заново?")){ const sh=state.shrimps, lv=state.level; state={...fresh(), level:lv, shrimps:sh}; save(); renderAll(); } };
$("resetAll").onclick=()=>{ if(confirm("Сбросить весь прогресс и креветки?")){ state=fresh(); generated={}; save(); renderAll(); } };
const pick=$("levelPick");
for(let n=1;n<=MAXLEVEL;n++){ const o=document.createElement("option"); o.value=n; o.textContent=n+". "+BUILTIN[n].fr; pick.appendChild(o); }
function goLevel(n){ const sh=state.shrimps; state={...fresh(), level:n, shrimps:sh}; save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"}); toast("Уровень "+n); }
pick.onchange=()=>{ const n=+pick.value; if(n!==state.level) goLevel(n); };
$("nextLevelBtn").onclick=()=>{ if(state.level<MAXLEVEL) goLevel(state.level+1); };
$("adminBtn").onclick=()=>{ admin=!admin; save(); renderAll(); };
function renderAdmin(){
  $("adminBtn").textContent=admin?"🔑 Админ включён (выключить)":"🔑 Админ";
  $("adminBtn").setAttribute("aria-pressed",admin);
  $("adminBox").hidden=!admin;
  $("nextLevelBtn").disabled=state.level>=MAXLEVEL;
  pick.value=Math.min(state.level,MAXLEVEL);
}
renderAll();
</script>
</body>
