<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Français avec Marcel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9F0FB; --paper:#FFFFFF; --ink:#18275A; --soft:#5B6A94;
  --bleu:#2346A8; --rouge:#E2453C; --line:#CDD8EE;
  --water1:#7FD3E6; --water2:#2E8FB8; --sand:#F1D9A0;
  --ok:#14885A; --okbg:#DDF5E9; --bad:#C8322A; --badbg:#FDE3E1;
  --warn:#C77700; --warnbg:#FFF1DA; --violet:#6A38C2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1838; --paper:#18244D; --ink:#EEF2FF; --soft:#A9B6DD;
    --bleu:#8EA8FF; --rouge:#FF6E66; --line:#2C3B6E;
    --water1:#2B7F9C; --water2:#123E63; --sand:#8C7746;
    --ok:#4FD39A; --okbg:#173D33; --bad:#FF8A82; --badbg:#4A1E2A;
    --warn:#F0A63A; --warnbg:#4A3A1E; --violet:#8B67E6;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1838; --paper:#18244D; --ink:#EEF2FF; --soft:#A9B6DD;
  --bleu:#8EA8FF; --rouge:#FF6E66; --line:#2C3B6E;
  --water1:#2B7F9C; --water2:#123E63; --sand:#8C7746;
  --ok:#4FD39A; --okbg:#173D33; --bad:#FF8A82; --badbg:#4A1E2A;
  --warn:#F0A63A; --warnbg:#4A3A1E; --violet:#8B67E6;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 60px;display:grid;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.45rem,5vw,2.1rem);font-weight:700;letter-spacing:-.01em}
h1 .flag{display:inline-block;width:.55em;height:1.1em;vertical-align:-.15em;margin-right:.35em;border-radius:4px;
  background:linear-gradient(90deg,#2346A8 0 33%,#fff 33% 66%,#E2453C 66%);box-shadow:0 0 0 2px var(--line)}
.pill{font-size:1.1rem;font-weight:600;background:var(--paper);border:2px solid var(--line);padding:6px 14px;border-radius:999px;white-space:nowrap}

.marcel{display:flex;gap:12px;align-items:flex-end}
.cat{font-size:62px;line-height:1;flex:none;transform-origin:bottom center}
.cat.happy{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bubble{background:var(--paper);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:12px 16px;flex:1}
.bubble .fr{font-weight:600;font-size:1.15rem}
.bubble .ru{color:var(--soft)}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px}
.level-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.level-num{font-size:1.3rem;font-weight:700}
.construction{color:var(--soft)}
.bar{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden;margin:10px 0 6px}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bleu),var(--rouge));transition:width .4s}
.prog{font-weight:600}

.stages{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;background:var(--bg)}
.stage{flex:none;font:inherit;font-size:.95rem;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.stage[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stage:disabled{opacity:.5;cursor:not-allowed}
.stage .ck{color:var(--ok)}

.list{display:grid;gap:10px}
.item{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px}
.item.done{border-color:var(--ok);background:var(--okbg)}
.item.wrong{border-color:var(--bad)}
.item-top{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-content:center;font-weight:600;font-size:.9rem;background:var(--bg);border:2px solid var(--line)}
.item.done .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.texts{flex:1;min-width:0}
.fr{font-size:1.25rem;font-weight:600;color:var(--bleu)}
.ru{color:var(--soft)}
.ru.big{font-size:1.2rem;color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:1rem;border:none;border-radius:14px;padding:10px 14px;cursor:pointer;color:#fff;background:var(--bleu);min-height:46px}
.btn.red{background:var(--rouge)}
.btn.violet{background:var(--violet)}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--rouge) 30%,transparent)}}
.btn:focus-visible,.stage:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 11px;flex:1;min-width:0}
.marks{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.theory{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:2px 14px 8px;margin-bottom:12px}
.theory summary{cursor:pointer;font-weight:600;padding:10px 0;line-height:1.3}
.theory-body{font-size:.98rem;line-height:1.5}
.theory-body p{margin:.5em 0}
.theory-body ul{margin:.4em 0;padding-left:1.1em}
.theory-body li{margin:.65em 0;line-height:1.4}
.theory-body .r{display:block}
.theory-body .ex{display:block;margin-top:.15em;font-weight:600;color:var(--bleu)}
.known{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:40px;padding:0 10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-weight:600;font-size:.9rem;line-height:1.1;cursor:pointer}
.known input{width:20px;height:20px;margin:0;accent-color:var(--ok);cursor:pointer}
.item.done .known{border-color:var(--ok);background:var(--paper)}
.known:focus-within{outline:3px solid var(--rouge);outline-offset:2px}
.forgot-mark input{accent-color:var(--warn)}
.item.forgot{border-color:var(--warn);background:var(--warnbg)}
.item.forgot .num{background:var(--warn);color:#fff;border-color:var(--warn)}
.item.forgot .forgot-mark{border-color:var(--warn);background:var(--paper)}
.substages{display:flex;gap:6px;overflow-x:auto;padding:2px}
.hint{color:var(--soft);font-size:.95rem;margin:0 0 4px}

.fb{border-radius:12px;padding:8px 12px;font-size:.98rem}
.fb.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.fb.bad{background:var(--badbg)}
.fb .said{margin:2px 0}
.w-ok{color:var(--ok);font-weight:600}
.w-bad{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.w-extra{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.tip{margin-top:6px;color:var(--ink)}
.fb .said{font-size:1.12rem;margin:2px 0 4px}
.fb .lbl{font-size:.9rem;color:var(--soft);font-weight:400}
.fb.ok .said{color:var(--ink);font-weight:400}
.fb.live{background:var(--bg);font-size:1.1rem}
.fb .note{font-size:.9rem;color:var(--soft);font-weight:400;margin-top:2px}
.w-near{color:#C77700;font-weight:600;text-decoration:underline dotted}
.w-dim{color:var(--soft)}
.tip::before{content:"🐈 "}

.opts{display:grid;gap:6px}
.opt{font:inherit;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through}
.q{font-size:1.15rem;font-weight:600}

.wrap>*{min-width:0}
.levelnav{display:flex;gap:6px;margin:10px 0 4px}
.levelnav button{flex:none;width:46px;min-height:46px;font:inherit;font-size:1.4rem;line-height:1;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;cursor:pointer}
.levelnav button:disabled{opacity:.4;cursor:not-allowed}
.levelnav select{flex:1;min-width:0;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;min-height:46px;padding:0 8px}
.levelnav button:focus-visible,.levelnav select:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
.voicebox{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px;min-width:0}
.voicebox .lbl{font-size:.9rem;color:var(--soft)}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;font:inherit;font-size:.88rem;line-height:1.15;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-height:46px;padding:4px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button:focus-visible,.voicerow select:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
.voicerow{display:flex;gap:6px}
.voicerow select{flex:1;min-width:0;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;min-height:46px;padding:0 8px}
.voicerow .btn{flex:none;min-height:46px}
.notice{background:var(--badbg);border-radius:14px;padding:10px 14px}

.aqua{position:relative;border-radius:24px 24px 18px 18px;overflow:hidden;border:3px solid var(--ink);background:var(--bg)}
.aqua svg{display:block;width:100%;height:auto}
.aqua-empty{position:absolute;right:10px;top:12px;width:44%;text-align:center;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px 14px 4px 14px;font-weight:500;font-size:.85rem;line-height:1.25;z-index:3;padding:6px 10px}
.paw{animation:pat 5s ease-in-out infinite}
@keyframes pat{0%,34%{transform:rotate(-24deg)}46%{transform:rotate(4deg)}51%{transform:rotate(-7deg)}56%{transform:rotate(4deg)}61%{transform:rotate(-7deg)}66%{transform:rotate(4deg)}80%,100%{transform:rotate(-24deg)}}
.poke{transform-box:fill-box;transform-origin:center;animation:wig 5s ease-in-out infinite}
@keyframes wig{0%,45%{transform:none}50%{transform:translateY(-3px) rotate(-14deg)}56%{transform:translateY(0) rotate(9deg)}62%{transform:translateY(-3px) rotate(-10deg)}68%{transform:translateY(0) rotate(6deg)}74%,100%{transform:none}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 4s ease-in-out infinite alternate}
@keyframes breath{from{transform:scaleY(1)}to{transform:scaleY(1.035)}}
.win{text-align:center;padding:24px 16px}
.win .big{font-size:3rem}
details summary{cursor:pointer;color:var(--soft);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:480px){.cat{font-size:50px}.fr{font-size:1.12rem}}
@media (max-width:600px){
  .item.sp .item-top{flex-wrap:wrap;align-items:center}
  .item.sp .item-top .num{order:1}
  .item.sp .item-top .marks{order:2}
  .item.sp .marks{gap:6px;flex-wrap:nowrap}
  .item.sp .known{padding:0 8px;gap:5px;font-size:.85rem}
  .item.sp .known input{width:18px;height:18px}
  .item.sp .item-top .texts{order:3;flex:1 1 100%}
  .item.sp .item-top > .btn{order:4;flex:1 1 100%;min-height:54px;font-size:1.05rem}
  .item.sp .actions{flex-direction:column;align-items:stretch}
  .item .actions .btn{flex:none;width:100%;min-height:54px;font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="flag" aria-hidden="true"></span>Français avec Marcel</h1>
    <div class="pill" id="shrimpTop">🦐 Crevettes : 0</div>
  </header>

  <section class="marcel" aria-live="polite">
    <div class="cat" id="cat" aria-hidden="true">🐈</div>
    <div class="bubble"><div class="fr" id="sayFr"></div><div class="ru" id="sayRu"></div></div>
  </section>

  <section class="panel">
    <div class="level-row">
      <div class="level-num" id="levelNum"></div>
      <div class="construction" id="construction"></div>
    </div>
    <div class="levelnav">
      <button type="button" id="lvPrev" aria-label="Предыдущий уровень">‹</button>
      <select id="levelPick" aria-label="Выбрать уровень"></select>
      <button type="button" id="lvNext" aria-label="Следующий уровень">›</button>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" id="barWrap"><span id="bar"></span></div>
    <div class="prog" id="prog"></div>
    <div class="voicebox">
      <div class="lbl">Скорость озвучки</div>
      <div class="seg" id="speedSeg" role="group" aria-label="Скорость озвучки">
        <button type="button" data-rate="0.5">🐢 Очень медленно</button>
        <button type="button" data-rate="0.75">🐌 Медленно</button>
        <button type="button" data-rate="1">🐇 Нормально</button>
      </div>
      <div class="lbl" id="voiceLbl">Голос озвучки</div>
      <div class="voicerow" id="voiceRow"><select id="voicePick" aria-label="Голос озвучки"></select><button type="button" class="btn ghost" id="voiceTest" aria-label="Проверить голос">🔊</button></div>
    </div>
  </section>

  <div id="micNotice"></div>

  <nav class="stages" id="stages" aria-label="Этапы"></nav>

  <main id="main"></main>

  <section class="panel" aria-label="Марсель и миска с креветками">
    <div class="aqua" id="aqua"></div>
    <details style="margin-top:10px">
      <summary>⚙️ Настройки</summary>
      <div class="actions" style="margin-top:10px">
        <button class="btn ghost" id="restartLevel">Начать уровень заново</button>
        <button class="btn ghost" id="resetAll">Сбросить весь прогресс</button>
        <button class="btn ghost" id="adminBtn" aria-pressed="false">🔑 Админ</button>
      </div>
      <div class="actions" id="adminBox" hidden style="margin-top:10px">
        <button class="btn violet" id="nextLevelBtn">⏭ Сразу на следующий уровень</button>
      </div>
    </details>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- DATA ---------- */
const BUILTIN = {"1": {fr: "Je veux + nombre + nom", ru: "Я хочу + количество + предмет", phrases: [["Je veux une pomme. Je ne veux pas de pomme.", "Я хочу одно яблоко. Я не хочу одно яблоко."], ["Je veux trois bananes. Je ne veux pas trois bananes.", "Я хочу три банана. Я не хочу три банана."], ["Je veux six œufs. Je ne veux pas six œufs.", "Я хочу шесть яиц. Я не хочу шесть яиц."], ["Je veux douze crevettes. Je ne veux pas douze crevettes.", "Я хочу двенадцать креветок. Я не хочу двенадцать креветок."], ["Je veux quinze pêches. Je ne veux pas quinze pêches.", "Я хочу пятнадцать персиков. Я не хочу пятнадцать персиков."], ["Je veux dix-sept oignons. Je ne veux pas dix-sept oignons.", "Я хочу семнадцать луковиц. Я не хочу семнадцать луковиц."], ["Je veux vingt et un citrons. Je ne veux pas vingt et un citrons.", "Я хочу двадцать один лимон. Я не хочу двадцать один лимон."], ["Je veux trente-six bonbons. Je ne veux pas trente-six bonbons.", "Я хочу тридцать шесть конфет. Я не хочу тридцать шесть конфет."], ["Je veux quarante-deux courgettes. Je ne veux pas quarante-deux courgettes.", "Я хочу сорок два кабачка. Я не хочу сорок два кабачка."], ["Je veux soixante et onze baguettes. Je ne veux pas soixante et onze baguettes.", "Я хочу семьдесят один багет. Я не хочу семьдесят один багет."], ["Je veux quatre-vingt-trois bouteilles de lait. Je ne veux pas quatre-vingt-trois bouteilles de lait.", "Я хочу восемьдесят три бутылки молока. Я не хочу восемьдесят три бутылки молока."], ["Je veux cent pains au chocolat. Je ne veux pas cent pains au chocolat.", "Я хочу сто булочек с шоколадом. Я не хочу сто булочек с шоколадом."]]}, "2": {fr: "J'ai…", ru: "У меня есть…", phrases: [["J'ai vingt-trois voitures. Je n'ai pas vingt-trois voitures.", "У меня есть двадцать три машины. У меня нет двадцати трёх машин."], ["J'ai quatre-vingt-trois réservations. Je n'ai pas quatre-vingt-trois réservations.", "У меня есть восемьдесят три брони. У меня нет восьмидесяти трёх броней."], ["J'ai deux sœurs. Je n'ai pas deux sœurs.", "У меня есть две сестры. У меня нет двух сестёр."], ["J'ai cinq chats. Je n'ai pas cinq chats.", "У меня есть пять котов. У меня нет пяти котов."], ["J'ai douze billets. Je n'ai pas douze billets.", "У меня есть двенадцать билетов. У меня нет двенадцати билетов."], ["J'ai trente-six questions. Je n'ai pas trente-six questions.", "У меня есть тридцать шесть вопросов. У меня нет тридцати шести вопросов."], ["J'ai quarante-deux amis. Je n'ai pas quarante-deux amis.", "У меня есть сорок два друга. У меня нет сорока двух друзей."], ["J'ai soixante et onze euros. Je n'ai pas soixante et onze euros.", "У меня есть семьдесят один евро. У меня нет семидесяти одного евро."], ["J'ai vingt et une chaises. Je n'ai pas vingt et une chaises.", "У меня есть двадцать один стул. У меня нет двадцати одного стула."], ["J'ai deux cent cinquante grammes de beurre. Je n'ai pas deux cent cinquante grammes de beurre.", "У меня есть двести пятьдесят грамм масла. У меня нет двухсот пятидесяти грамм масла."], ["J'ai deux litres de lait. Je n'ai pas deux litres de lait.", "У меня есть два литра молока. У меня нет двух литров молока."], ["J'ai vingt-huit ans. Je n'ai pas vingt-huit ans.", "Мне двадцать восемь лет. Мне не двадцать восемь лет."]]}, "3": {fr: "Je prends…", ru: "Я беру…", phrases: [["Je prends un café. Je ne prends pas de café.", "Я беру кофе. Я не беру кофе."], ["Je prends deux croissants. Je ne prends pas deux croissants.", "Я беру два круассана. Я не беру два круассана."], ["Je prends le bus. Je ne prends pas le bus.", "Я еду на автобусе. Я не еду на автобусе."], ["Je prends cette robe. Je ne prends pas cette robe.", "Я беру это платье. Я не беру это платье."], ["Je prends un dessert. Je ne prends pas de dessert.", "Я беру десерт. Я не беру десерт."], ["Je prends deux verres d'eau. Je ne prends pas deux verres d'eau.", "Я беру два стакана воды. Я не беру два стакана воды."], ["Je prends neuf yaourts. Je ne prends pas neuf yaourts.", "Я беру дев /* ---------- CHECKING ---------- */
const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const TENS={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
// digits from speech recognition -> French words; a final "1" becomes "§1" (= un OR une)
function numFr(n){
  if(n<20) return n===1?"§1":U[n];
  if(n>=1000) return String(n);
  if(n>=100){ const h=Math.floor(n/100), r=n%100, c=h===1?"cent":U[h]+" cent"+(r===0?"s":""); return r?c+" "+numFr(r):c; }
  const t=Math.floor(n/10), u=n%10;
  if(t<=6) return TENS[t]+(u===0?"":u===1?" et §1":"-"+U[u]);
  if(t===7) return "soixante"+(u===1?" et onze":"-"+U[10+u]);
  if(t===8) return u===0?"quatre-vingts":"quatre-vingt-"+(u===1?"§1":U[u]);
  return "quatre-vingt-"+U[10+u];
}
const FILLERS=new Set(["euh","heu","bah","ben","hum","mmm"]);
function tokens(s){
  return s.toLowerCase().replace(/\d+/g,d=>" "+numFr(+d)+" ").replace(/[’`´]/g,"'").replace(/œ/g,"oe").replace(/æ/g,"ae")
    .replace(/[.,!?;:«»"()…]/g," ").replace(/-/g," ").replace(/'/g,"")
    .split(/\s+/).filter(w=>w && !FILLERS.has(w));
}
function deaccent(w){return w.normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function sound(w){ w=deaccent(w); return w.length>3 ? w.replace(/(ent|es|s|x|t|e)$/,"") : w.replace(/[sxt]$/,""); }
// "exact" | "near" (sounds the same) | "accent" (typed, accents differ) | false
function eq(t, s, mode){
  if(t===s) return "exact";
  if(s==="§1" && (t==="un"||t==="une")) return "exact";
  if(deaccent(t)===deaccent(s)) return mode==="speech" ? "near" : "accent";
  if(mode==="speech" && sound(t)===sound(s)) return "near";
  return false;
}
function check(target, said, mode){
  const T=tokens(target);
  const saidWords=said.trim().split(/\s+/), owner=[], S=[];
  saidWords.forEach((w,wi)=>tokens(w).forEach(tk=>{S.push(tk);owner.push(wi);}));
  const n=T.length, m=S.length, L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) L[i][j]= eq(T[i],S[j],mode) ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const tOk=Array(n).fill(false), sType=Array(m).fill(false);
  let i=0,j=0; while(i<n&&j<m){ const e=eq(T[i],S[j],mode); if(e){ tOk[i]=true; sType[j]=e; i++;j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  const ok = tOk.every(Boolean) && sType.every(Boolean);
  const near = sType.some(x=>x==="near"), accent = sType.some(x=>x==="accent");
  // target words
  const shown=target.replace(/-/g," ").split(/\s+/);
  let k=0; const tHtml=shown.map(w=>{ const parts=tokens(w); if(!parts.length) return esc(w); let good=true; parts.forEach(()=>{ if(!tOk[k++]) good=false; }); return '<span class="'+(good?"w-ok":"w-bad")+'">'+esc(w)+'</span>'; }).join(" ");
  // what she actually said, word by word
  const sHtml=saidWords.map((w,wi)=>{
    const types=sType.filter((_,x)=>owner[x]===wi);
    if(!types.length) return '<span class="w-dim">'+esc(w)+'</span>';
    const cls = types.includes(false) ? "w-extra" : types.some(t=>t==="near"||t==="accent") ? "w-near" : "w-ok";
    return '<span class="'+cls+'">'+esc(w)+'</span>';
  }).join(" ");
  return {ok, near, accent, tHtml, sHtml};
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBroken=!SR, rec=null, recBtn=null;
function listen(btn, onText, onLive){
  if(rec){ try{rec.stop();}catch(e){} if(recBtn===btn) return; }
  const me=new SR(); rec=me; recBtn=btn;
  me.lang="fr-FR"; me.interimResults=true; me.continuous=true; me.maxAlternatives=1;
  let got="", heard="", timer=null;
  // не обрываем на первой паузе: останавливаемся, когда тишина длится дольше
  const arm=ms=>{ clearTimeout(timer); timer=setTimeout(()=>{ try{me.stop();}catch(e){} }, ms); };
  me.onstart=()=>{btn.classList.add("listening");btn.textContent="⏹ Stop"; if(onLive) onLive("…"); arm(8000);};
  me.onresult=e=>{
    const fin=[], tmp=[];
    for(const r of e.results){ (r.isFinal?fin:tmp).push(r[0].transcript.trim()); }
    got=fin.join(" ").trim(); heard=fin.concat(tmp).join(" ").trim();
    if(onLive) onLive(heard||"…");
    arm(1500);
  };
  me.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){ micBroken=true; renderNotice(); renderMain(); }

  };

    if(rec===me){ rec=null; recBtn=null; }
    const text=(got||heard).trim();
    if(text) onText(text); else if(onLive) onLive("rien entendu, essaie encore"); };

}

/* ---------- RENDER ---------- */
const isRev=k=>k.indexOf("rev_")===0;
function stageCount(k){
  if(k==="rev") return 3*state.forgot.length;
  if(isRev(k)) return state.forgot.length;
  const d=levelData(state.level); return d?d.phrases.length:12;
}
function doneCount(k){
  if(k==="rev") return REV_SUBS.reduce((n,x)=>n+doneCount(x.key),0);
  if(isRev(k)) return state.forgot.filter(i=>state.done[k][i]).length;
  return state.done[k].filter(Boolean).length;
}
function unl(){ return admin ? STAGES.length-1 : state.unlocked; }
function revDone(){ return doneCount("rev")>=stageCount("rev"); }
function subUnlocked(i){ return admin || i===0 || (doneCount("rev_rep")>=stageCount("rev_rep") && (i===1 || doneCount("rev_ass")>=stageCount("rev_ass"))); }
// «Повтор» открывается после «Dis-le», «Test final» — когда нечего повторять или всё повторено
function syncUnlock(){
  if(doneCount("dis")<stageCount("dis")) return;
  state.unlocked = revDone() ? Math.max(state.unlocked,4) : 3;
}
// у каждой вкладки свой порядок карточек, он сохраняется на весь уровень
function range(n){ return Array.from({length:n},(_,i)=>i); }
function makeOrder(n){
  let ass,dis,fin;
  do{ ass=shuffle(range(n)); dis=shuffle(range(n)); fin=shuffle(range(n)); }while([ass[0],dis[0],fin[0]].some(x=>x===0) || new Set([ass[0],dis[0],fin[0]]).size<3);
  return {lv:state.level, n, rep:range(n), ass, dis, fin};
}
function order(name){
  const d=levelData(state.level), n=d?d.phrases.length:12;
  if(!state.order || state.order.lv!==state.level || state.order.n!==n || !state.order.fin || state.order.fin.length!==n){ state.order=makeOrder(n); save(); }
  return state.order[name];
}
// state.fg хранит отметки по этапам («Associe», «Dis-le»), state.forgot — все отложенные карточки для шага «Повтор»
function syncForgot(){ state.forgot=[...new Set([...state.fg.ass,...state.fg.dis,...state.fg.fin])].sort((x,y)=>x-y); }
function setForgot(idx,on,stage){
  const had=state.forgot.indexOf(idx)>=0, a=state.fg[stage], i=a.indexOf(idx);
  if(on && i<0) a.push(idx);
  if(!on && i>=0) a.splice(i,1);
  syncForgot();
  if(on && !had){ ["rev_rep","rev_ass","rev_dis"].forEach(r=>{ state.done[r][idx]=false; }); if(stage!=="fin" && state.unlocked>=4 && !state.won) state.unlocked=3; }
}

function renderHeader(){

// за каждую из четырёх вкладок («Écoute & répète», «Associe», «Dis-le», «Test final») одна креветка за уровень
function award(k){ if(state.earned[k]) return false; state.earned[k]=true; state.shrimps++; return true; }
function stageComplete(k){
  if(k==="fin"){ const got=award("fin"); state.won=true; toast(got?"Bravo ! +1 🦐 Niveau terminé !":"Bravo ! Niveau terminé !"); }
  else if(k==="rep"||k==="ass"){
    const got=award(k), si=STAGES.findIndex(s=>s.key===k), pre=got?"+1 🦐 ":"";
    if(si+1>state.unlocked){ state.unlocked=si+1; toast("Bravo ! "+pre+"Этап открыт: "+STAGES[si+1].tab); } else if(got) toast("Bravo ! +1 🦐");
  }
  else if(k==="dis"){
    const got=award("dis"), before=state.unlocked, pre=got?"+1 🦐 ":""; syncUnlock();
    if(state.unlocked>before) toast("Bravo ! "+pre+"Этап открыт: "+STAGES[state.unlocked].tab); else if(got) toast("Bravo ! +1 🦐");
  }
  else if(isRev(k)){
    if(revDone()){
      if(state.fg.fin.length){ state.fg.fin=[]; syncForgot(); toast("Bravo ! Карточки вернулись в "+STAGES[4].tab); }
      else { const before=state.unlocked; syncUnlock(); if(state.unlocked>before) toast("Bravo ! Этап открыт: "+STAGES[4].tab); }

/* варианты похожи на правильный ответ, порядок каждый раз новый */
function wordsOf(t){ return new Set(t.toLowerCase().replace(/[’'\-.,!?;:«»"()…]/g," ").split(/\s+/).filter(Boolean)); }
function jacc(a,b){ let n=0; a.forEach(x=>{ if(b.has(x)) n++; }); return n/((a.size+b.size-n)||1); }
function lev(a,b){
  let prev=Array.from({length:b.length+1},(_,j)=>j);

  const p=planFor(state.level);
  btn.disabled=true; out.textContent="Марсель готовит фразы… это может занять до минуты 🐈";
  const prompt=`Составь материалы для урока разговорного французского (уровень начинающий, ученица говорит по-русски).
Конструкция уровня: "${p.fr}" (${p.ru}). Темы: ${p.theme}.
Нужно ровно 12 коротких фраз, где КАЖДАЯ использует только эту конструкцию (меняются слова и числа).
Фразы — естественный современный разговорный французский, 3–7 слов, реальная бытовая лексика. Если в конструкции есть количество, используй числа от 1 до 100 (сначала маленькие, потом больше), всегда словами, а не цифрами. Перевод — естественный русский. Все русские переводы должны быть разными.
Ответь ТОЛЬКО JSON без пояснений: {"phrases":[["фраза fr","перевод ru"], ... 12 штук]}`;
  try{
    const data=await sample.json(prompt,{modelTier:"default"});
    if(!data || !Array.isArray(data.phrases) || data.phrases.length<12) throw {code:"bad"};
    generated[state.level]={fr:p.fr, ru:p.ru, phrases:data.phrases.slice(0,12)};
    save(); renderAll();
  }catch(e){
    btn.disabled=false;
    out.textContent = e && e.code==="not_granted" ? "Без разрешения Марсель не может подготовить фразы." :
      e && e.code==="rate_limited" ? "Слишком много запросов. Подожди минуту и попробуй снова." : "Не получилось подготовить фразы. Попробуй ещё раз.";
  }
}

function ruShrimp(n){ return n%10===1&&n%100!==11 ? "креветку" : (n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)) ? "креветки" : "креветок"; }
function renderMain(){
  const m=$("main"); m.innerHTML="";
  const d=levelData(state.level);
  if(state.won){
    const earnedN=Object.values(state.earned).filter(Boolean).length;
    const w=document.createElement("section"); w.className="panel win";
    w.innerHTML='<div class="big">🐈🎉🦐</div><h2 style="margin:.3em 0">Bravo ! Niveau terminé !</h2><p>Браво! Уровень завершён!<br><b>Tu as gagné '+earnedN+' crevette'+(earnedN>1?'s':'')+' sur ce niveau !</b> За уровень ты получила '+earnedN+' '+ruShrimp(earnedN)+'.</p><p class="pill" style="display:inline-block">🦐 Crevettes : '+state.shrimps+'</p><div style="margin-top:14px"><button class="btn violet" id="nextLevel">Niveau suivant → Следующий уровень</button></div>';
    m.appendChild(w);
    w.querySelector("#nextLevel").onclick=()=>goLevel(state.level+1);
    return;
  }
  if(!d){
    const w=document.createElement("section"); w.className="panel win";
    w.innerHTML='<div class="big">🐈🏆</div><h2 style="margin:.3em 0">Félicitations ! Tous les niveaux sont terminés !</h2><p>Поздравляю! Все уровни пройдены. Можно пройти любой уровень заново в настройках.</p>';
    m.appendChild(w); return;
  }
  const k=STAGES[state.view].key, list=document.createElement("div"); list.className="list";
  if(k==="rev"){ renderReview(m,d); return; }
  const tb=theoryBlock(k==="rep"); if(tb) m.appendChild(tb);
  if(k==="rep") order("rep").forEach((i,n)=>list.appendChild(speechItem(i,d.phrases[i][0],d.phrases[i][1],"rep",false,n+1)));
  if(k==="ass") order("ass").forEach((i,n)=>list.appendChild(assItem(i,d,"ass",n+1)));
  if(k==="dis") order("dis").forEach((i,n)=>list.appendChild(speechItem(i,d.phrases[i][0],d.phrases[i][1],"dis",true,n+1)));
  if(k==="fin") order("fin").forEach((i,n)=>list.appendChild(speechItem(i,d.phrases[i][0],d.phrases[i][1],"fin",true,n+1)));
  m.appendChild(list);
  if(k==="fin" && state.fg.fin.length){
    const rv=document.createElement("div"); rv.style.marginTop="14px";
    rv.innerHTML='<button class="btn violet" style="width:100%;font-size:1.15rem">Отложено карточек '+state.fg.fin.length+'. Дальше: '+esc(STAGES[3].tab)+'</button>';
    rv.querySelector("button").onclick=()=>{ state.view=3; state.revView=0; save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    m.appendChild(rv);
  }
  const tot=stageCount(k);
  if(doneCount(k)>=tot && state.view<3){
    const to = state.view===2 && !state.forgot.length ? 4 : state.view+1;
    const nx=document.createElement("div"); nx.style.marginTop="14px";
    nx.innerHTML='<button class="btn violet" style="width:100%;font-size:1.15rem">Этап пройден! Дальше: '+esc(STAGES[to].tab)+'</button>';
    nx.querySelector("button").onclick=()=>{state.view=to;save();renderAll();window.scrollTo({top:0,behavior:"smooth"});};
    m.appendChild(nx);
  }
}

function renderReview(m,d){
  if(!state.forgot.length){
    const w=document.createElement("section"); w.className="panel win";
    w.innerHTML='<div class="big">🐈✨</div><h2 style="margin:.3em 0">Повторять нечего!</h2><p>Ты не откладывала карточки. Можно идти на финальный тест.</p><div style="margin-top:14px"><button class="btn violet" id="goFin">Дальше: '+esc(STAGES[4].tab)+'</button></div>';
    w.querySelector("#goFin").onclick=()=>{ state.view=4; save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    m.appendChild(w); return;
  }
  let rv=Math.min(state.revView,2); while(rv>0 && !subUnlocked(rv)) rv--;
  state.revView=rv;
  const nav=document.createElement("nav"); nav.className="substages"; nav.setAttribute("aria-label","Шаги повторения");
  REV_SUBS.forEach((s,i)=>{
    const b=document.createElement("button"); b.className="stage";
    const complete=doneCount(s.key)>=stageCount(s.key);
    b.innerHTML=(!subUnlocked(i)?"🔒 ":"")+esc(s.tab)+(complete?' <span class="ck">✓</span>':"");
    b.disabled=!subUnlocked(i); b.setAttribute("aria-pressed",i===rv);
    b.onclick=()=>{ state.revView=i; save(); renderMain(); renderHeader(); window.scrollTo({top:0,behavior:"smooth"}); };
    nav.appendChild(b);
  });
  m.appendChild(nav);
  const hint=document.createElement("p"); hint.className="hint";
  hint.textContent="Здесь только карточки, которые ты отложила ("+state.forgot.length+"). Пройди три шага по порядку.";
  m.appendChild(hint);
  const key=REV_SUBS[rv].key, list=document.createElement("div"); list.className="list";
  const seq = key==="rev_ass" ? order("ass") : key==="rev_dis" ? order("dis") : order("rep");
  seq.filter(i=>state.forgot.indexOf(i)>=0).forEach((i,n)=>{
    const [fr,ru]=d.phrases[i];
    list.appendChild(key==="rev_ass" ? assItem(i,d,key,n+1) : speechItem(i,fr,ru,key,key==="rev_dis",n+1));
  });
  m.appendChild(list);
  if(doneCount(key)>=stageCount(key)){
    const last=rv===2, nx=document.createElement("div"); nx.style.marginTop="14px";
    nx.innerHTML='<button class="btn violet" style="width:100%;font-size:1.15rem">'+(last?"Всё повторено! Дальше: "+esc(STAGES[4].tab):"Шаг пройден! Дальше: "+esc(REV_SUBS[rv+1].tab))+'</button>';
    nx.querySelector("button").onclick=()=>{
      if(last){ state.view=4; } else state.revView=rv+1;
      save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
    };
    m.appendChild(nx);
  }
}

const CAT_SVG=`

const PAW_SVG=`<g transform="translate(166 154)"><g class="paw">
<circle r="13" fill="#8a8478"/>

<path d="M108 -6 v12 M102 -8 v16 M96 -8 v16" stroke="#cfc8bc" stroke-width="1.6" stroke-linecap="round"/>
</g></g>`;
function sceneSVG(n){
  const shown=Math.min(n,24), pts=[];
  for(let i=0;i<shown;i++) pts.push({x:262+((i*29+7)%68), y:149+((i*13+3)%13), r:((i*53)%50)-25});
  const poke=new Set(pts.map((q,i)=>[q.x,i]).sort((a,b)=>a[0]-b[0]).slice(0,3).map(a=>a[1]));
  const shr=pts.map((q,i)=>'<g'+(poke.has(i)?' class="poke"':'')+'><text x="'+q.x+'" y="'+q.y+'" font-size="21" transform="rotate('+q.r+' '+q.x+' '+q.y+')">🦐</text></g>').join("");
  const bowlBack='<ellipse cx="305" cy="152" rx="58" ry="14" fill="#e9eefb" stroke="#3b5ab0" stroke-width="2"/><ellipse cx="305" cy="153" rx="51" ry="10" fill="#2f3f7a"/>';
  const bowlFront='<path d="M247 152 A58 14 0 0 0 363 152 Q358 192 305 192 Q252 192 247 152 Z" fill="#5b7fd6" stroke="#3b5ab0" stroke-width="2"/><path d="M257 170 Q305 184 353 170" stroke="#fff" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>';
  const more=n>24?'<text x="305" y="207" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">× '+n+'</text>':"";
  return '<svg viewBox="0 0 370 212" role="img" aria-label="Кот Марсель лежит рядом с миской и трогает креветок лапкой"><rect width="370" height="212" style="fill:var(--bg)"/><rect y="164" width="370" height="48" style="fill:var(--sand)"/>'+
    '<ellipse cx="108" cy="196" rx="108" ry="8" fill="#000" opacity=".12"/><ellipse cx="305" cy="196" rx="64" ry="7" fill="#000" opacity=".12"/>'+
    CAT_SVG+bowlBack+shr+bowlFront+PAW_SVG+more+'</svg>';
}
let aquaShown=-1;
function renderAqua(){
  if(aquaShown===state.shrimps) return;
  aquaShown=state.shrimps;
  const a=$("aqua"); a.innerHTML=sceneSVG(state.shrimps);
  if(!state.shrimps){ const e=document.createElement("div"); e.className="aqua-empty"; e.textContent="Миска пуста. Заработай первую креветку!"; a.appendChild(e); }
}
function renderAll(){ renderHeader(); renderNotice(); renderMain(); renderAqua(); renderAdmin(); }

$("restartLevel").onclick=()=>{ if(confirm("Начать текущий уровень заново?")){ const sh=state.shrimps, lv=state.level; state={...fresh(), level:lv, shrimps:sh}; save(); renderAll(); } };
$("resetAll").onclick=()=>{ if(confirm("Сбросить весь прогресс и креветки?")){ state=fresh(); generated={}; levelsSaved={}; save(); renderAll(); } };
// прогресс каждого уровня хранится отдельно, поэтому можно переключаться туда и обратно
function goLevel(n){
  n=Math.max(1,Math.min(MAXLEVEL,n)); if(n===state.level) return;
  levelsSaved[state.level]=JSON.parse(JSON.stringify(state));
  const sh=state.shrimps, prev=levelsSaved[n];
  state=prev ? {...fresh(),...prev, level:n, shrimps:sh} : {...fresh(), level:n, shrimps:sh};
  state.done={...fresh().done,...state.done}; state.fg={ass:[],dis:[],fin:[],...state.fg};
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"}); toast("Уровень "+n);
}
const pick=$("levelPick");
$("levelPick").onchange=()=>goLevel(+pick.value);
$("lvPrev").onclick=()=>goLevel(state.level-1);
$("lvNext").onclick=()=>goLevel(state.level+1);
$("nextLevelBtn").onclick=()=>goLevel(state.level+1);
$("adminBtn").onclick=()=>{ admin=!admin; save(); renderAll(); };
function levelDone(n){ const st=n===state.level?state:levelsSaved[n]; return !!(st&&st.won); }
function renderAdmin(){
  $("adminBtn").textContent=admin?"🔑 Админ включён (выключить)":"🔑 Админ";
  $("adminBtn").setAttribute("aria-pressed",admin);
  $("adminBox").hidden=!admin;
  $("nextLevelBtn").disabled=state.level>=MAXLEVEL;
  pick.innerHTML="";
  for(let n=1;n<=MAXLEVEL;n++){ const o=document.createElement("option"); o.value=n; o.textContent=(levelDone(n)?"✓ ":"")+n+". "+BUILTIN[n].fr; pick.appendChild(o); }
  pick.value=Math.min(state.level,MAXLEVEL);
  $("lvPrev").disabled=state.level<=1; $("lvNext").disabled=state.level>=MAXLEVEL;
}
renderAll();
</script>
